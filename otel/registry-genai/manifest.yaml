# SignalDB conventions layered on the OpenTelemetry GenAI semantic conventions
# (OTel Weaver, format manifest/2.0).
#
# Kept apart from otel/registry/ because that registry is live-checked with
# `--include-unreferenced`, and core semconv's deprecated gen_ai.* shells
# collide with the GenAI definitions once both are loaded. Both registries
# share one Weaver pin (>= v0.26, for GenAI's definition/2 model).
# src/common/build.rs folds these groups into the bundled `signaldb` schema
# registry, resolved against `otel` and `otel-genai`.
# `cargo xtask vendor-semconv-genai <commit>` vendors GenAI and rewrites the
# commit below; the build fails if they differ.
name: signaldb-genai
description: SignalDB conventions over the OpenTelemetry GenAI semantic conventions
# x-release-please-start-version
schema_url: https://cedricziel.github.io/signaldb/schemas/genai/0.4.1
# x-release-please-end
dependencies:
  - schema_url: https://opentelemetry.io/schemas/gen-ai-dev/1.42.0-dev
    registry_path: https://github.com/open-telemetry/semantic-conventions-genai.git@e57c543b4889619eb2a05702471937db5119165d[model]
