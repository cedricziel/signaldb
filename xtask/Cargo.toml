[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
progenitor = "0.15.0"
openapiv3 = "2.2.0"
serde_json.workspace = true
prettyplease = "0.3"
syn = "3"
quote = "1"
anyhow.workspace = true
clap.workspace = true
# Was a build-dependency of tempo-api; proto generation moved here so the
# crate has no build script writing into its own package directory.
tonic-prost-build.workspace = true
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[package.metadata.cargo-machete]
# workspace-hack is managed by `cargo hakari` (see workspace-hack/README.md)
ignored = ["workspace-hack"]
