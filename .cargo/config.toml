# ------------------------------------------------------------
# Shared build cache across the entire workspace
# ------------------------------------------------------------
[build]
target-dir = "target"

[alias]
xtask = "run --package xtask --"

[env]
RUST_BACKTRACE = { value = "1", condition = { env_not_set = "RUST_BACKTRACE" } }

# Ubuntu's aarch64-linux-musl-gcc is a spec wrapper around the glibc gcc, so it
# links the glibc-built libgcc.a whose outline-atomics init (lse-init.o)
# references __getauxval — a symbol musl doesn't provide. Any C compile+link
# touching atomics fails, which makes jemalloc's configure conclude the platform
# has no atomics at all. Disabling outline atomics (LL/SC instead of
# runtime-dispatched LSE) removes the libgcc dependency. cc-rs reads this
# target-scoped variable, so it is inert for every other target.
CFLAGS_aarch64_unknown_linux_musl = { value = "-mno-outline-atomics", condition = { env_not_set = "CFLAGS_aarch64_unknown_linux_musl" } }

# ------------------------------------------------------------
# CPU target features
# ------------------------------------------------------------
# +aes switches ahash (DataFusion's group-by/join/repartition hasher) from its
# fallback mixer to hardware AES rounds — ahash gates this at compile time, so
# without the flag every binary ships the slow path. The SSE4/NEON set lets
# Arrow kernels and simdutf8 take their vectorized branches without runtime
# dispatch. Requires post-2010 x86 (Westmere) / ARMv8-with-crypto CPUs; binaries
# fault with SIGILL on anything older. aarch64-apple-darwin needs no section:
# its baseline already includes aes+neon.
#
# CAUTION: a set RUSTFLAGS env var REPLACES every `rustflags` key below — cargo
# picks exactly one source and does not merge them. CI must therefore keep
# RUSTFLAGS unset (`rustflags: ""` on actions-rust-lang/setup-rust-toolchain,
# which otherwise defaults to `-D warnings`), or none of this applies and the
# release artifacts silently ship the scalar fallback and the default linker.
# The `linker` keys are unaffected — only `rustflags` is clobbered.

# Faster linking on Linux (requires mold linker to be installed)
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=mold",
    "-C", "target-feature=+aes,+sse2,+ssse3,+sse4.1,+sse4.2",
]

# Static musl links the whole DataFusion/Arrow/Parquet/Iceberg graph into every
# binary, so the link step dominates the release build; mold cuts it materially.
# clang is the driver (rustc supplies the self-contained musl crt objects).
[target.x86_64-unknown-linux-musl]
linker = "clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=mold",
    "-C", "target-feature=+aes,+sse2,+ssse3,+sse4.1,+sse4.2",
]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+aes,+neon"]

# No mold here yet, unlike the x86_64 musl target above: this triple's C
# toolchain is already the fragile one (see the CFLAGS note at the top), and the
# linker swap has not been verified against it. Worth revisiting once someone
# can test an aarch64 musl link end to end.
[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+aes,+neon"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-feature=+aes,+sse2,+ssse3,+sse4.1,+sse4.2"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+aes,+sse2,+ssse3,+sse4.1,+sse4.2"]
