# Configuration for cargo-audit
# See: https://docs.rs/cargo-audit/latest/cargo_audit/

[advisories]
ignore = [
    # Advisory about a vulnerability in rsa, which we don't use, but it is pulled in via sqlx due
    # to a bug in cargo. See https://github.com/shuttle-hq/shuttle/pull/1475 for context.
    "RUSTSEC-2023-0071",
    # arrow2 0.18.0 is a transitive dependency of grafana-plugin-sdk v0.5.0.
    # arrow2 is unmaintained with no fix available. The Grafana plugin is for development/testing.
    # Tracked: https://github.com/grafana/grafana-plugin-sdk-rust/issues
    "RUSTSEC-2025-0038",
    # quick-xml 0.39 is pinned by object_store 0.13; the fix (quick-xml 0.41) is only in
    # object_store 0.14.1, but datafusion 54 requires object_store ^0.13.2. Remove when moving
    # to a datafusion release on object_store 0.14+. XML parsing only used for S3 list
    # responses from trusted endpoints. Mirrors the same ignores in deny.toml.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # rustls-webpki 0.101 comes via rustls 0.21, a legacy TLS path in aws-smithy-http-client.
    # Only pulled in by aws-config in tests-integration (dev-only). The 0.103 copy used in
    # production paths is on the fixed 0.103.13. Mirrors the same ignores in deny.toml.
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    # rkyv 0.7 enters the lockfile as an inert optional dependency of rust_decimal (pinned by
    # the iceberg-rust fork). Not compiled into any SignalDB target (`cargo tree -i rkyv` finds
    # no reachable path), so the archive-validation vulnerability is unexploitable. Fix requires
    # rust_decimal on rkyv 0.8.17+; remove when the iceberg-rust fork updates. Mirrors deny.toml.
    "RUSTSEC-2026-0235",
    # crypto-bigint 0.5.5 comes via openidconnect 4.0.1 -> p256/p384 0.13 -> elliptic-curve 0.13.
    # openidconnect only uses P-256/P-384 to verify ID-token signatures against the IdP's public
    # keys, so no secret flows through the non-constant-time operations. The fix (0.7.6) needs
    # elliptic-curve 0.14; remove when openidconnect moves to it. Mirrors deny.toml.
    "RUSTSEC-2026-0387",
    # zstd 0.13 / zstd-safe 7 are pinned by arrow-ipc and parquet 59 (and datafusion 55), which
    # require zstd ^0.13; the fixes are only in zstd 0.14.3 / zstd-safe 8.2. Our direct zstd 0.14
    # use is on the fixed 0.14.3. Arrow IPC and Parquet reuse `zstd::bulk` contexts, but each bulk
    # call (de)compresses a whole frame, so no stream is abandoned mid-way; neither uses `Seekable`
    # or the streaming `with_context` constructors. Remove when DataFusion moves to an Arrow
    # release on zstd 0.14. Mirrors deny.toml.
    "RUSTSEC-2026-0391",
    "RUSTSEC-2026-0398",
    "RUSTSEC-2026-0403",
]
