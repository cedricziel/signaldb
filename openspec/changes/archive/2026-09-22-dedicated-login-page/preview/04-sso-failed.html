<!-- @dsCard group="Auth" -->
<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSO failed · SignalDB</title>
<link rel="stylesheet" href="login.css">
</head>
<body>
<div class="login-page">
  <main class="login-main">
    <div class="login-brand"><svg viewBox="0 0 18 18" aria-hidden="true"><rect width="18" height="18" rx="4" fill="#14181e"/><path d="M2 9 L5 9 L7 4 L10 14 L13 6 L14.5 9 L16 9" stroke="#f58a3c" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span>SignalDB</span></div>
    <section class="login-card">
      <div class="login-alert" role="alert"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg><span>Single sign-on failed. Try again, or sign in with your email and password.</span></div>
      
<h1>Sign in</h1>
<p class="login-hint">Use your account to explore logs, traces and metrics.</p>

<a class="login-sso" href="/ui/session/oidc/start?redirect=%2Flogs"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="m10.9 12.1 9.1-9.1M15 8l3 3"/></svg><span>Continue with Authentik</span></a>
<div class="login-divider" aria-hidden="true">or</div>

<form class="login-form" method="post" action="/ui/session">
  <label>Email<input name="email" type="email" autocomplete="username" value=""  placeholder="you@company.dev"></label>
  <label>Password<input name="password" type="password" autocomplete="current-password" value="" ></label>
  
  <button class="login-submit login-submit--soft" type="submit">Sign in</button>
</form>

    </section>
  </main>
  <footer class="login-foot"><a href="https://signaldb.dev/docs">Docs</a><span>·</span><a href="https://signaldb.dev">signaldb.dev</a></footer>
</div>
</body>
</html>
