[package]
name = "tests-integration"
version = "0.1.6"
edition.workspace = true
# Integration tests are one binary (tests/main.rs) plus the two
# subscriber-capturing tests; see tests/main.rs for the rationale.
autotests = false
license.workspace = true
publish = false

[lib]
name = "tests_integration"
path = "src/lib.rs"

[dependencies]
# Workspace crates
acceptor = { path = "../src/acceptor" }
common = { path = "../src/common", features = ["testing"] }
compactor = { path = "../src/compactor" }
querier = { path = "../src/querier" }
router = { path = "../src/router" }
writer = { path = "../src/writer" }
tempo-api = { path = "../src/tempo-api" }
pyroscope-api = { path = "../src/pyroscope-api" }
signaldb-sdk = { path = "../src/signaldb-sdk" }
signaldb-cli = { path = "../src/signaldb-cli" }
mcp-server = { path = "../src/mcp-server" }

# External dependencies
anyhow.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
datafusion.workspace = true
arrow-flight.workspace = true
object_store.workspace = true
tonic.workspace = true
tempfile.workspace = true
futures.workspace = true
opentelemetry-proto.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk = { workspace = true, features = ["trace", "testing"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "registry"] }
tracing-opentelemetry.workspace = true
axum.workspace = true
tower.workspace = true
clap.workspace = true
reqwest.workspace = true
serde_json.workspace = true
hex.workspace = true
prost.workspace = true
snap.workspace = true
chrono.workspace = true
bytes.workspace = true
uuid.workspace = true
datafusion_iceberg.workspace = true

# Iceberg catalog for integration tests
iceberg-rust.workspace = true

# For test-specific utilities
url.workspace = true
testcontainers-modules.workspace = true

# Optional dependencies for benchmarks
criterion = { workspace = true, optional = true }

[features]
# Enables the Criterion read-path benchmarks under benches/.
benchmarks = ["dep:criterion"]

[[bench]]
name = "querier_read_paths"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "querier_service_read_paths"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "compaction"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "trace_index_scaling"
harness = false
required-features = ["benchmarks"]





























[package.metadata.cargo-machete]
# These dependencies are used in integration tests under tests/ directory
ignored = ["acceptor", "anyhow", "arrow-flight", "compactor", "datafusion", "futures", "iceberg-rust", "log", "mcp-server", "opentelemetry-proto", "querier", "router", "signaldb-cli", "tokio", "tokio-stream", "tonic", "writer"]

[[test]]
name = "integration"
path = "tests/main.rs"

[[test]]
name = "http_response_headers"
path = "tests/http_response_headers.rs"

[[test]]
name = "ops_endpoints_tracing"
path = "tests/ops_endpoints_tracing.rs"

[[test]]
name = "mcp_router_trace_continuity"
path = "tests/mcp_router_trace_continuity.rs"
