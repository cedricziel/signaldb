language: en-US
reviews:
  # CodeRabbit submits "Request changes" and flips to "Approve" once all of
  # its review comments are resolved — making its approval a real merge
  # signal instead of advisory comments.
  request_changes_workflow: true
  auto_review:
    enabled: true
    drafts: false
    # Dependabot PRs are auto-generated version bumps; CI (build/test/lint)
    # is the real signal for them, and the "CodeRabbit" required check was
    # left perpetually pending since it never fires for skipped authors.
    ignore_usernames:
      - dependabot[bot]
