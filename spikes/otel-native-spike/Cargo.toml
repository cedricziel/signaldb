# Spike crate for the otel-native-schema change (openspec/changes/otel-native-schema).
# Layer 0 (blocking): warm typed containment index, dual-layout coexistence scan,
# and benchmarks on real data — BEFORE any layout commit.
#
# Deliberately standalone (excluded from the root workspace): spike code is
# throwaway evidence, not product code; it must not gate workspace clippy/machete.
# Dependency pins mirror the root workspace exactly so findings transfer.
[package]
name = "otel-native-spike"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
common = { path = "../../src/common" }

datafusion = { version = "54.1.0", default-features = false, features = [
    "parquet",
    # warm_index spike (0.1) exercises `array_has` for the native-pushdown test.
    "nested_expressions",
] }
arrow = { version = "58.3.0", features = ["prettyprint"] }
parquet = { version = "58.3.0", features = ["arrow", "async"] }

datafusion_iceberg = { git = "https://github.com/cedricziel/iceberg-rust", rev = "46c41afdff93ac92ef540bddc258db7173f38c9d" }
iceberg-rust = { git = "https://github.com/cedricziel/iceberg-rust", rev = "46c41afdff93ac92ef540bddc258db7173f38c9d" }

tokio = { version = "1.48.0", features = ["rt-multi-thread", "fs", "sync", "time", "macros", "io-util"] }
futures = "0.3.31"
anyhow = "1.0.102"
serde_json = "1.0"
ciborium = "0.2"
tempfile = "3"
rand = "0.9"
