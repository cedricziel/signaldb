# SignalDB Distribution Configuration
# Copy to signaldb.toml and adjust for your environment

[database]
# Database for internal metadata storage
dsn = "sqlite://.data/signaldb.db"
# dsn = "postgres://user:password@localhost/signaldb"

[auth]
# Multi-Tenancy Authentication Configuration
# API key validation and tenant isolation are always enforced on the
# tenant-facing ingest and query APIs; there is no off switch. (The
# former `enabled` flag never did anything and was removed.) The
# internal Flight ports are controlled separately by
# internal_service_key below.

# Admin API key for the /api/v1/admin/* management endpoints
# Generate a strong random key for production use
# admin_api_key = "sk-admin-your-secret-key-here"

# Shared secret for service-to-service Arrow Flight calls (router -> querier,
# acceptor -> writer). When set, the Flight ports (writer 50051, router 50053,
# querier 50054, compactor 50055) require every call to present either this
# key or a valid tenant API key; tenant callers are then scoped to their own
# tenant, and the writer/compactor ports accept the internal key only. When
# unset, the Flight ports are UNAUTHENTICATED and must be restricted to a
# trusted network.
# All SignalDB services must share the same value.
# internal_service_key = "sk-internal-your-secret-key-here"

# Default per-tenant rate limits and quotas, applied to every tenant without
# an explicit [auth.tenants.limits] override. Unset fields mean unlimited.
# Exceeding a rate limit returns HTTP 429 / gRPC RESOURCE_EXHAUSTED
# (retryable); exceeding a count quota returns HTTP 429 with error code
# "quota_exceeded".
# [auth.default_limits]
# max_ingest_requests_per_sec = 100
# max_ingest_bytes_per_sec = 10485760   # 10 MiB/s
# max_query_requests_per_sec = 50       # router HTTP query API
# max_api_keys = 10                     # active (non-revoked) keys per tenant
# max_datasets = 25                     # datasets per tenant
# max_storage_bytes = 107374182400      # 100 GiB of live Iceberg data files;
#                                       # ingest is rejected while usage is at
#                                       # or above this cap (eventually
#                                       # consistent, refreshed periodically)
# burst_seconds = 2.0                   # burst allowance in seconds of budget

# Tenant definitions with API keys and datasets
# Each tenant is isolated with separate WAL paths and Iceberg catalogs

# Example tenant: Acme Corporation
[[auth.tenants]]
id = "acme"
slug = "acme"
name = "Acme Corporation"
default_dataset = "production"  # Used when X-Dataset-ID header is not provided

# Per-tenant limits override (takes precedence over [auth.default_limits])
# [auth.tenants.limits]
# max_ingest_requests_per_sec = 500
# max_ingest_bytes_per_sec = 52428800   # 50 MiB/s
# max_query_requests_per_sec = 200
# max_api_keys = 20
# max_datasets = 50
# max_storage_bytes = 1073741824000     # 1 TiB

# API keys for the Acme tenant
# Each key can have a descriptive name for auditing
[[auth.tenants.api_keys]]
key = "sk-acme-prod-key-123"       # The actual API key used in Authorization: Bearer header
name = "Production Key"             # Human-readable name for this key

[[auth.tenants.api_keys]]
key = "sk-acme-staging-key-456"
name = "Staging Key"

# Datasets for the Acme tenant
# Tenants can have multiple datasets for environment isolation
[[auth.tenants.datasets]]
id = "production"
slug = "production"
is_default = true

[[auth.tenants.datasets]]
id = "staging"
slug = "staging"
is_default = false

# Example tenant: Beta Inc
[[auth.tenants]]
id = "beta"
slug = "beta"
name = "Beta Inc"
default_dataset = "default"

[[auth.tenants.api_keys]]
key = "sk-beta-key-789"
name = "Beta Production Key"

[[auth.tenants.datasets]]
id = "default"
slug = "default"
is_default = true

# Optional: Custom schema configuration per tenant
# [[auth.tenants.schema_config]]
# catalog_type = "sql"
# catalog_uri = "sqlite://.data/acme_catalog.db"

# Authentication Headers Required:
# - Authorization: Bearer <api-key>
# - X-Tenant-ID: <tenant-id>
# - X-Dataset-ID: <dataset-id> (optional, uses default_dataset if not provided)
#
# Example authenticated OTLP request:
#   curl -X POST http://localhost:4318/v1/traces \
#     -H "Authorization: Bearer sk-acme-prod-key-123" \
#     -H "X-Tenant-ID: acme" \
#     -H "X-Dataset-ID: production" \
#     -H "Content-Type: application/json" \
#     -d @traces.json

[storage]
# Object storage for data files (Parquet, etc.)
dsn = "file:///.data/storage"
# dsn = "memory://"                    # In-memory storage for testing
# dsn = "s3://my-bucket/signaldb/"     # S3 storage (future)

[schema]
# Iceberg catalog configuration for table metadata
#
# IMPORTANT: the in-memory default only works in monolithic mode (the
# single `signaldb` binary). Standalone services REFUSE to start with an
# in-memory catalog — every process would get its own private catalog.
# Distributed deployments must point catalog_uri at a shared database:
# PostgreSQL for production, a shared sqlite:// file for single-host dev.
catalog_type = "sql"                   # sql (recommended) or memory
catalog_uri = "sqlite::memory:"        # In-memory SQLite catalog (monolithic only)
# catalog_uri = "sqlite://.data/catalog.db"  # Persistent SQLite catalog
# catalog_uri = "postgres://user:password@localhost:5432/iceberg"  # Production PostgreSQL

# Default schemas to create for new tenants
[schema.default_schemas]
traces_enabled = true
logs_enabled = true
metrics_enabled = true
profiles_enabled = true

# Attribute keys to promote from the *_attributes JSON into dedicated,
# queryable columns per signal type. Materialized labels are matched
# exactly (and support regex / ordered comparisons) instead of the
# substring-in-JSON approximation. Keep the lists short and low-cardinality
# — every entry adds a column. Applies to tables created after the change;
# pre-existing tables fall back to JSON matching for these keys.
# Per-tenant override: a tenant schema block replaces the global set
# wholesale ([[auth.tenants]] -> [auth.tenants.schema.materialized_labels]).
# [schema.materialized_labels]
# logs = ["namespace", "pod", "container"]
# traces = ["http.method", "http.status_code"]
# metrics = []
# profiles = []

# Custom schema definitions (optional)
# [schema.default_schemas.custom_schemas]
# my_custom_table = '''{"fields": [...]}'''

# Advanced Iceberg Configuration (all settings are optional and auto-optimized)
# These provide fine-grained control for specialized workloads

# [schema.optimization]
# # Batch processing optimization (automatic by default)
# max_rows_per_batch = 50000           # Maximum rows per batch before splitting
# max_memory_per_batch_mb = 128        # Maximum memory per batch in MB
# enable_auto_split = true             # Automatically split oversized batches
# target_concurrent_batches = 4        # Number of batches to process concurrently
# 
# # Catalog caching for performance (enabled by default)
# enable_catalog_caching = true        # Cache catalog connections
# catalog_cache_ttl_seconds = 300      # Cache TTL in seconds (5 minutes)
#
# # Connection pooling for production (automatic by default)
# min_connections = 2                  # Minimum pool connections
# max_connections = 10                 # Maximum pool connections
# connection_timeout_ms = 5000         # Connection timeout
# idle_timeout_seconds = 300           # Idle connection timeout
# max_lifetime_seconds = 1800          # Connection max lifetime
#
# # Retry logic for reliability (enabled by default)
# max_retry_attempts = 3               # Maximum retry attempts
# initial_retry_delay_ms = 100         # Initial retry delay
# max_retry_delay_seconds = 5          # Maximum retry delay
# retry_backoff_multiplier = 2.0       # Exponential backoff multiplier

[discovery]
# Service discovery configuration
#
# IMPORTANT: the in-memory default only works in monolithic mode.
# Standalone services REFUSE to start with an in-memory registry —
# services could never discover each other. Use PostgreSQL for
# production; a shared sqlite:// file works for single-host dev.
dsn = "sqlite::memory:"               # In-memory service registry (monolithic only)
heartbeat_interval = "30s"
poll_interval = "60s"
ttl = "300s"

[wal]
# Write-Ahead Log configuration
#
# Base directory for WAL files. Each service appends its own suffix:
# the acceptor writes to {wal_dir}/acceptor and the writer to
# {wal_dir}/writer. The ACCEPTOR_WAL_DIR / WRITER_WAL_DIR environment
# variables (full service directory) override this per service.
wal_dir = ".data/wal"
max_segment_size = 67108864           # 64MB
max_buffer_entries = 1000
flush_interval = "30s"
max_buffer_size_bytes = 134217728     # 128MB

[querier]
# Querier resource limits — bound what a single query (or tenant) can do
# to the shared querier process.
#
# Maximum memory for query execution, in MiB. When unset the memory pool
# is UNBOUNDED (a startup warning is logged) and one heavy query can OOM
# the process. Strongly recommended in production.
# memory_limit_mb = 4096
#
# Fraction of memory_limit_mb usable by query operators before they
# spill to disk or fail (0.0-1.0).
memory_pool_fraction = 0.8
#
# Wall-clock timeout per Flight query.
query_timeout = "60s"
#
# Row cap for raw SQL queries received over Flight.
max_sql_rows = 1000000
#
# Upper bound for the client-supplied `limit` on /api/search (trace
# count; the span fetch limit is 50x this value).
max_search_limit = 1000
#
# Maximum queries a single tenant may run concurrently; excess queries
# are rejected with RESOURCE_EXHAUSTED (retryable). Unset = unlimited.
# max_concurrent_queries_per_tenant = 8

[compactor]
# Compactor Service Configuration
# The compactor manages the complete data lifecycle with three phases:
#   Phase 1: Dry-run compaction planning
#   Phase 2: Active Parquet file compaction for storage efficiency
#   Phase 3: Retention enforcement and lifecycle management (NEW)
#
# Phase 2: Compaction Settings
enabled = true                        # Enable compactor service (enabled by default)
tick_interval = "5m"                  # Interval between compaction planning cycles
target_file_size_mb = 128             # Target file size after compaction (MB)
file_count_threshold = 5              # Minimum files to trigger compaction
min_input_file_size_kb = 1024         # Minimum input file size for compaction (KB)
max_files_per_job = 20                # Maximum files per compaction job

# Phase 4: Multi-Instance Safety + Scheduling
# Multiple compactor instances coordinate through distributed leases in the
# SQL catalog; the round-robin scheduler ensures per-tenant fairness.
max_candidates_per_cycle = 20         # Max candidates per scheduling cycle (0 = unlimited)
max_per_tenant = 5                    # Max candidates per tenant per cycle (0 = unlimited)
lease_ttl_seconds = 300               # Lease validity without renewal; crashed instances
                                      # release their partitions after this TTL

# Phase 6: Observability
# HTTP endpoint serving Prometheus metrics (/metrics), a JSON status document
# (/status), and a liveness probe (/health). Set to "" to disable.
# Override with COMPACTOR_METRICS_ADDR.
metrics_addr = "0.0.0.0:9091"

# Phase 3: Retention Enforcement Configuration
# Automatically drops expired partitions based on configurable retention policies.
# Uses a 3-tier hierarchy: Global defaults → Tenant overrides → Dataset overrides.
#
# IMPORTANT: Retention enforcement is ON by default and DELETES data older
# than 30 days. Set enabled = false (or longer durations) to keep data
# longer; set dry_run = true to log decisions without deleting.
[compactor.retention]
enabled = true                        # Enable retention enforcement (default: true)
dry_run = false                       # Enforce deletions (default: false; set true to only log)
retention_check_interval = "1h"       # Interval between retention checks (default: 1h)
grace_period = "1h"                   # Safety margin before cutoff (prevents clock skew issues)
timezone = "UTC"                      # Timezone for logging (internal storage uses UTC)
snapshots_to_keep = 5                 # Keep last N snapshots per table (minimum: 1)

# Global Default Retention Periods (per signal type)
# These apply to all tenants/datasets unless overridden below.
traces = "30d"                        # Trace data retention (default: 30 days)
logs = "30d"                          # Log data retention (default: 30 days)
metrics = "30d"                       # Metric data retention (default: 30 days)

# Tenant-Specific Retention Overrides (optional)
# Override global defaults for specific tenants.
# Use array-of-tables syntax: [[compactor.retention.tenant_overrides]]
#
# Example: Production tenant with custom retention (mixed overrides)
# [[compactor.retention.tenant_overrides]]
# tenant_id = "production"
# traces = "30d"                      # Override: Keep production traces for 30 days
# logs = "7d"                         # Override: Keep production logs for 7 days
# metrics = "90d"                     # Override: Keep production metrics for 90 days
#
# # Dataset-Specific Retention Overrides (highest priority)
# # Override tenant defaults for specific datasets within a tenant.
# [[compactor.retention.tenant_overrides.dataset_overrides]]
# dataset_id = "critical"
# traces = "90d"                      # Override: Keep critical traces for 90 days
# logs = "14d"                        # Override: Keep critical logs for 14 days
#
# [[compactor.retention.tenant_overrides.dataset_overrides]]
# dataset_id = "staging"
# traces = "1d"                       # Override: Keep staging traces for only 1 day
# logs = "1d"                         # Override: Keep staging logs for only 1 day
#
# Resolution Example:
#   Global:    traces = 30 days
#   Tenant:    traces = 30 days (overrides global)
#   Dataset:   traces = 90 days (overrides tenant)
# Result:
#   - production/critical → 90 days (dataset override)
#   - production/staging  → 1 day (dataset override)
#   - production/default  → 30 days (tenant override)
#   - other/any          → 30 days (global default)

# Phase 3: Orphan File Cleanup Configuration
# Automatically detects and deletes unreferenced Parquet files to reclaim storage.
# Uses a 4-phase detection algorithm with safety-first design.
#
# IMPORTANT: Always test with dry_run = true first!
# Attribute auto-promotion (epic #737): decide from the persisted
# attribute statistics (compactor scan stats + querier query-demand
# counters in the catalog's attribute_stats table) which attribute keys
# should become materialized label_<key> columns. Dry-run logs the
# decision only; the schema-changing rewrite is gated behind dry_run=false
# (not yet implemented).
# [compactor.attr_promotion]
# enabled = false               # Enable the decision pass (default: false)
# dry_run = true                # Log decisions without schema changes (default: true)
# max_labels_per_table = 32     # Schema-width budget incl. pinned [schema.materialized_labels]
# min_presence = 0.005          # Minimum fraction of rows carrying the key
# min_query_hits = 1            # Minimum accumulated query demand
# promote_streak = 3            # Consecutive over-threshold cycles before promotion
# max_promotions_per_cycle = 4  # Promotion cap per rewrite cycle

[compactor.orphan_cleanup]
enabled = false                       # Enable orphan cleanup (opt-in, default: false)
dry_run = true                        # Log orphans without deleting (safe default: true)
cleanup_interval_hours = 24           # Run cleanup every N hours (default: 24, once per day)

# Safety Settings (conservative defaults)
grace_period_hours = 24               # Don't delete files younger than this (default: 24h)
                                      # Protects against in-flight writes and race conditions
revalidate_before_delete = true       # Re-check file status before deletion (recommended: true)
                                      # Adds ~10% overhead but prevents accidental deletion
max_snapshot_age_hours = 720          # Consider snapshots within last N hours (default: 720 = 30 days)
                                      # Files referenced by older snapshots may be incorrectly flagged

# Performance Settings
batch_size = 1000                     # Process N files per batch (default: 1000)
                                      # Smaller = more checkpoints, larger = faster processing
max_live_files_threshold = 500000     # Skip cleanup for tables whose estimated live file
                                      # count exceeds this cap (bounds memory use; 0 = no cap).
                                      # Skips are recorded in compactor_orphan_cleanup_skipped_total
rate_limit_delay_ms = 0               # Delay between batches in milliseconds (default: 0)
                                      # Use if hitting object store rate limits (S3 throttling)

# Orphan Cleanup Safety Explained:
# 1. Grace Period: Files younger than grace_period_hours are NEVER deleted
# 2. Revalidation: Before deletion, re-check if file is still orphaned (catches races)
# 3. Snapshot Window: Only scan recent snapshots to reduce memory usage
# 4. Batch Processing: Process in batches with progress tracking for resumability
#
# Tuning Guidance:
# - High-volume systems: increase batch_size (2000-5000), add rate_limit_delay_ms
# - Low-memory systems: decrease batch_size (250-500), reduce max_snapshot_age_hours
# - Aggressive cleanup: reduce grace_period_hours (12h), reduce cleanup_interval_hours (12h for more frequent runs)

# Self-monitoring: SignalDB observes itself (dogfooding).
# Services export their own traces/logs/metrics via OTLP to SignalDB's
# acceptor, stored under the reserved `_system` tenant / `_monitoring`
# dataset. Requires auth.admin_api_key when auth is enabled (the tenant is
# auto-provisioned with that key if not configured explicitly).
[self_monitoring]
# Enable self-monitoring telemetry export (default: false)
# enabled = true
# OTLP gRPC endpoint of the acceptor to export to (default shown)
# endpoint = "http://localhost:4317"
# Metric export interval (default: 60s)
# interval = "60s"
# Tenant/dataset the telemetry is stored under (defaults shown).
# Requests for this tenant are exempt from re-instrumentation (anti-loop guard).
# tenant_id = "_system"
# dataset_id = "_monitoring"
# Fraction of self-monitoring traces to sample, 0.0-1.0 (default: 0.1 = 10%).
# Standard OTel env vars take precedence: OTEL_TRACES_SAMPLER=traceidratio
# (or always_on / always_off / parentbased_traceidratio) and
# OTEL_TRACES_SAMPLER_ARG=<ratio>.
# trace_sample_ratio = 0.1
# Profile this process's CPU and store the profiles in SignalDB itself
# (OTLP profiles to `endpoint` under the tenant/dataset above). Works even
# when `enabled` is false. Mutually exclusive with [profiling] below —
# both drive the same SIGPROF sampler; when both are set, [profiling] wins.
# profiles_enabled = true
# CPU sampling frequency in Hz (default: 99 — off-round to avoid sampling
# in lockstep with periodic work)
# profile_sample_rate_hz = 99
# How often a profile window is exported (default: 60s)
# profile_interval = "60s"
# Also export a heap (inuse_space/bytes) profile each window. Requires the
# jemalloc-profiling build feature and jemalloc profiling active at runtime
# (MALLOC_CONF=prof:true). Independent of CPU profiling — jemalloc does not
# use SIGPROF — so it can run alongside profiles_enabled or [profiling].
# heap_profiles_enabled = true

# Browser (Explore UI) telemetry export. The UI is always instrumented so
# same-origin API calls carry a W3C traceparent; this controls whether the
# browser also *exports* its spans, and where. The router serves these values
# to the browser at runtime (GET /ui/runtime-config.js), so one container image
# can be pointed at any endpoint via config alone — no UI rebuild.
[self_monitoring.frontend]
# Export browser spans (default: false). When false the UI still propagates
# traceparent but exports nothing.
# enabled = true
# OTLP/HTTP base URL the *browser* posts to — must be reachable from the user's
# browser (not localhost), typically the acceptor's HTTP port. /v1/traces is
# appended if absent.
# endpoint = "http://signaldb.example:4318"
# Ingest API key sent as `Authorization: Bearer` on browser exports.
# SECURITY: this is delivered to the browser and is world-readable to anyone who
# can load the UI. Use an INGEST-ONLY key scoped to tenant_id, never an admin
# key. Only appropriate on a trusted network (e.g. a homelab).
# api_key = "sk-ingest-only-key"
# Tenant/dataset the browser telemetry is stored under (defaults shown).
# tenant_id = "_system"
# dataset_id = "_monitoring"
# service.name on exported browser spans (default: "signaldb-ui").
# service_name = "signaldb-ui"
# Origins the acceptor accepts browser exports from (CORS). Empty (default)
# allows any origin, fine on a trusted network; list exact origins to restrict.
# allowed_origins = ["http://signaldb.example:3000"]

# Continuous profiling: CPU flame graphs (and optionally heap profiles)
# pushed to a Grafana Pyroscope server (docker compose includes one at
# http://localhost:4040).
[profiling]
# Enable continuous CPU profiling (default: false)
# enabled = true
# Pyroscope server URL (default shown)
# pyroscope_url = "http://localhost:4040"
# CPU sampling rate in Hz (default: 100)
# cpu_sample_rate = 100
# Heap profiling via jemalloc; requires binaries built with
# `--features jemalloc-profiling` and MALLOC_CONF=prof:true,prof_active:true
# memory_profiling = false

[tenants]
# Multi-tenant configuration (always active)
default_tenant = "default"

# Example tenant configuration
# [tenants.tenants.tenant1]
# enabled = true
# [tenants.tenants.tenant1.schema]
# catalog_type = "sql"
# catalog_uri = "sqlite://.data/tenant1_catalog.db"
# [tenants.tenants.tenant1.custom_schemas]
# traces = "custom_traces_schema_definition"
# logs = "custom_logs_schema_definition"

# MCP (Model Context Protocol) server — exposes SignalDB to AI agents.
# The MCP server is a thin, credential-forwarding client: it validates the
# caller's bearer token and forwards it to the router's HTTP API. It holds no
# key of its own, so tenant isolation stays enforced by the router.
# [mcp]
# enabled = false                       # off by default; set true to run the server
# bind_address = "0.0.0.0:8228"         # Streamable HTTP transport; serves MCP at /mcp
# router_url = "http://localhost:3000"  # router HTTP API to forward to

# Environment variable examples:
# SIGNALDB_MCP_ENABLED=true
# SIGNALDB_MCP_BIND_ADDRESS=0.0.0.0:8228
# SIGNALDB_MCP_ROUTER_URL=http://localhost:3000
# SIGNALDB_DATABASE_DSN=postgres://user:pass@localhost/signaldb
# SIGNALDB_STORAGE_DSN=file:///data/signaldb
# SIGNALDB_SCHEMA_CATALOG_TYPE=sql
# SIGNALDB_SCHEMA_CATALOG_URI=postgres://user:pass@localhost:5432/iceberg
# SIGNALDB_TENANTS_DEFAULT_TENANT=my_tenant

# Production environment example with Iceberg:
# SIGNALDB_DATABASE_DSN=postgres://signaldb:password@postgres:5432/signaldb_metadata
# SIGNALDB_STORAGE_DSN=s3://my-data-bucket/iceberg-tables/
# SIGNALDB_SCHEMA_CATALOG_TYPE=sql  
# SIGNALDB_SCHEMA_CATALOG_URI=postgres://iceberg:password@postgres:5432/iceberg_catalog