[package]
name = "common"
version = "0.3.0"
edition.workspace = true
license.workspace = true

[features]
default = []
testing = ["dep:tempfile"]
# Enables the Criterion ingest/WAL benchmarks under benches/.
benchmarks = ["dep:criterion"]
# Heap profiling via jemalloc: binaries built with this feature install
# jemalloc as global allocator, enable Pyroscope's jemalloc backend, and
# unlock heap self-profiling (jemalloc_pprof dumps + in-process symbolization).
jemalloc-profiling = [
    "pyroscope/backend-jemalloc",
    "dep:jemalloc_pprof",
    "dep:backtrace",
]

[dependencies]
# Optional: only pulled in by the `testing` feature, for `TempCatalog`.
tempfile = { workspace = true, optional = true }
anyhow.workspace = true
tempo-api = { path = "../tempo-api" }

datafusion.workspace = true
serde.workspace = true
serde_json.workspace = true
bincode.workspace = true
hex.workspace = true
base64.workspace = true
argon2.workspace = true
rand.workspace = true
thiserror.workspace = true
opentelemetry.workspace = true
opentelemetry-proto.workspace = true
async-trait.workspace = true

clap.workspace = true
figment.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing-opentelemetry.workspace = true
opentelemetry-appender-tracing.workspace = true
once_cell.workspace = true
tokio.workspace = true

humantime-serde.workspace = true

sqlx.workspace = true
uuid.workspace = true
dashmap.workspace = true
futures.workspace = true
chrono = { workspace = true }

arrow-flight.workspace = true
tonic.workspace = true
axum.workspace = true
tower.workspace = true

# Iceberg table format support
iceberg-rust.workspace = true
iceberg-sql-catalog.workspace = true

object_store.workspace = true
url.workspace = true
toml.workspace = true
utoipa.workspace = true
sha2 = "0.11"

# Self-monitoring (OTLP dogfooding)
opentelemetry_sdk = { workspace = true, features = ["trace", "metrics", "logs"] }
opentelemetry-otlp = { workspace = true, features = ["grpc-tonic", "trace", "metrics", "logs"] }
opentelemetry-semantic-conventions.workspace = true
sysinfo.workspace = true

# Prometheus remote write support
snap.workspace = true
prost.workspace = true

# Continuous profiling: the Pyroscope agent's pprof-rs/jemalloc backends are
# only supported on Linux/macOS (they bind to pthreads and pprof-rs), so the
# dependency is excluded on Windows. `profiling::init_profiling` compiles to a
# no-op stub there — see src/common/src/self_monitoring/profiling.rs.
[target.'cfg(not(target_os = "windows"))'.dependencies]
pyroscope.workspace = true
# Heap self-profiling (jemalloc-profiling feature): structured jemalloc heap
# dumps + in-process address symbolization. Already in the tree transitively
# via pyroscope's jemalloc backend.
jemalloc_pprof = { version = "0.9", optional = true }
backtrace = { version = "0.3", optional = true }

# Optional dependencies for benchmarks
criterion = { workspace = true, optional = true }

[[bench]]
name = "ingest_and_wal"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "signal_decode"
harness = false
required-features = ["benchmarks"]

# `wal_pending_gauge` reaches for `Wal::reset_pending_seed_claims_for_test`,
# which is gated on `cfg(any(test, feature = "testing"))`. Integration tests
# link the library built *without* `cfg(test)`, so the helper is reachable
# only through the feature — declare that requirement rather than forcing the
# feature on from a dev-dependency.
#
# The obvious alternative, a self dev-dependency
# (`common = { path = ".", features = ["testing"] }`), is legal Cargo but
# breaks two tools that walk the dependency graph: release-please aborts with
# `found cycle in dependency graph: common -> common`
# (googleapis/release-please#1662), and `cargo deny`'s `krates` panics on the
# self-edge. Renaming the dependency dodges release-please but makes krates
# panic harder, because the resolved name then disagrees with the manifest key.
#
# Cost of this approach: a bare `cargo test -p common` *skips* this test
# instead of running it. CI runs `--all-features`, so it is still gated there.
[[test]]
name = "wal_pending_gauge"
required-features = ["testing"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
testcontainers-modules.workspace = true
testcontainers.workspace = true
# Also a dev-dependency: `testing` compiles under plain `cfg(test)` too,
# where the feature (and so `dep:tempfile`) is not enabled.
tempfile.workspace = true
figment = { workspace = true, features = ["test"] }
opentelemetry_sdk = { workspace = true, features = ["trace", "metrics", "logs", "testing"] }
sha2 = "0.11"

[package.metadata.cargo-machete]
# async-trait is used by discovery backends
# opentelemetry-semantic-conventions is used in self_monitoring module
ignored = ["async-trait", "humantime-serde", "testcontainers", "opentelemetry-semantic-conventions"]
