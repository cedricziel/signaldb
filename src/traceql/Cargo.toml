# Published to crates.io as `traceql-parser` because a bare `traceql` is the
# name a consumer would guess, but the *import* path stays `traceql` so no
# call site spells the package name. See openspec design D1.
[package]
name = "traceql-parser"
version = "0.1.0"
edition = "2024"
description = "TraceQL lexer and parser for SignalDB's Tempo-compatible query interface"
# Grafana Tempo, whose language this implements, is AGPL-3.0. See design D2.
license = "AGPL-3.0"

[lib]
name = "traceql"

[dependencies]
thiserror.workspace = true
