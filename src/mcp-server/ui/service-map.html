<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Service map</title>
    <style>
      /*
   * Tokens. Host-supplied `styles.variables` (MCP Apps theming) are applied to
   * :root at runtime and win via the `var(--color-…, fallback)` chain below, so
   * the app inherits the host's surface while keeping its own signal accent.
   * Mirrors trace.html/profile.html.
   */
      :root {
        color-scheme: light dark;

        --sig: #05707e;
        --sig-2: #0fa2b4;

        --ground: var(--color-background-primary, #ffffff);
        --surface: var(--color-background-secondary, #f6fafa);
        --line: var(--color-border-primary, #d2dee0);
        --line-2: var(--color-border-secondary, #e3ebec);
        --ink: var(--color-text-primary, #0d1b1f);
        --ink-2: var(--color-text-secondary, #3f565c);
        --muted: var(--color-text-tertiary, #6c8188);
        --danger: var(--color-text-danger, #b93e37);

        --mono: var(
          --font-mono,
          ui-monospace,
          "SFMono-Regular",
          "JetBrains Mono",
          Menlo,
          Consolas,
          monospace
        );
        --sans: var(
          --font-sans,
          ui-sans-serif,
          system-ui,
          "Segoe UI",
          "Helvetica Neue",
          Arial,
          sans-serif
        );
        --radius: var(--border-radius-sm, 3px);
      }
      :root[data-theme="dark"] {
        --sig: #3ec4d6;
        --sig-2: #7be0ec;

        --ground: var(--color-background-primary, #101c20);
        --surface: var(--color-background-secondary, #16252a);
        --line: var(--color-border-primary, #26383e);
        --line-2: var(--color-border-secondary, #1b2c31);
        --ink: var(--color-text-primary, #e6f0f1);
        --ink-2: var(--color-text-secondary, #afc3c7);
        --muted: var(--color-text-tertiary, #7c949a);
        --danger: var(--color-text-danger, #f0736a);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --sig: #3ec4d6;
          --sig-2: #7be0ec;

          --ground: var(--color-background-primary, #101c20);
          --surface: var(--color-background-secondary, #16252a);
          --line: var(--color-border-primary, #26383e);
          --line-2: var(--color-border-secondary, #1b2c31);
          --ink: var(--color-text-primary, #e6f0f1);
          --ink-2: var(--color-text-secondary, #afc3c7);
          --muted: var(--color-text-tertiary, #7c949a);
          --danger: var(--color-text-danger, #f0736a);
        }
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: var(--ground);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 14px;
      }

      .lbl {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .status {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 22px 16px;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 12.5px;
      }
      .status .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--sig);
        flex: none;
      }
      @media (prefers-reduced-motion: no-preference) {
        .status .dot {
          animation: pulse 1.4s ease-in-out infinite;
        }
        @keyframes pulse {
          0%,
          100% {
            opacity: 0.25;
          }
          50% {
            opacity: 1;
          }
        }
      }
      .status.error {
        color: var(--danger);
      }
      .status.error .dot {
        background: var(--danger);
        animation: none;
      }

      .banner {
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--ink-2);
        font-family: var(--mono);
        font-size: 11.5px;
      }

      .summary {
        white-space: pre-line;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--ink-2);
        font-family: var(--mono);
        font-size: 11.5px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      caption {
        text-align: left;
        margin-bottom: 6px;
      }
      th,
      td {
        text-align: left;
        padding: 5px 8px;
        border-bottom: 1px solid var(--line-2);
        font-family: var(--mono);
      }
      th {
        color: var(--muted);
        font-weight: 500;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .node-service {
        color: var(--sig);
        font-weight: 600;
      }
      .node-external {
        color: var(--ink-2);
        font-style: italic;
      }
      .err {
        color: var(--danger);
      }
      .rule {
        height: 4px;
        border-radius: 2px;
        background: var(--sig-2);
        min-width: 2px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="status" id="status">
        <span class="dot"></span
        ><span id="status-text">Connecting to host&hellip;</span>
      </div>
    </div>

    <script>
      "use strict";
      (function () {
        /* ============================================================
         * MCP Apps bridge — JSON-RPC 2.0 over postMessage to the host.
         * Identical to trace.html/profile.html's bridge.
         * ============================================================ */

        var UI_PROTOCOL_VERSION = "2026-01-26";
        var HOST = window.parent;
        var pending = {};
        var nextId = 1;
        var hostContext = {};

        function post(msg) {
          if (HOST && HOST !== window) HOST.postMessage(msg, "*");
        }
        function request(method, params) {
          var id = nextId++;
          return new Promise(function (resolve, reject) {
            pending[id] = { resolve: resolve, reject: reject };
            post({
              jsonrpc: "2.0",
              id: id,
              method: method,
              params: params || {},
            });
          });
        }
        function notify(method, params) {
          post({ jsonrpc: "2.0", method: method, params: params || {} });
        }
        function respond(id, result) {
          post({ jsonrpc: "2.0", id: id, result: result });
        }

        window.addEventListener("message", function (event) {
          var msg = event.data;
          if (!msg || msg.jsonrpc !== "2.0") return;

          if (msg.id !== undefined && msg.method === undefined) {
            var waiter = pending[msg.id];
            if (!waiter) return;
            delete pending[msg.id];
            if (msg.error) waiter.reject(msg.error);
            else waiter.resolve(msg.result);
            return;
          }
          if (typeof msg.method !== "string") return;

          switch (msg.method) {
            case "ui/notifications/tool-input":
              onToolInput(msg.params || {});
              break;
            case "ui/notifications/tool-result":
              onToolResult(msg.params || {});
              break;
            case "ui/notifications/tool-cancelled":
              setStatus(
                "Service map fetch cancelled" + reasonSuffix(msg.params),
                true,
              );
              break;
            case "ui/notifications/host-context-changed":
              applyHostContext(msg.params || {});
              break;
            case "ui/resource-teardown":
              if (msg.id !== undefined) respond(msg.id, {});
              break;
            case "ping":
              if (msg.id !== undefined) respond(msg.id, {});
              break;
          }
        });

        function reasonSuffix(params) {
          return params && params.reason ? ": " + params.reason : "";
        }

        function applyHostContext(patch) {
          for (var key in patch) hostContext[key] = patch[key];
          var root = document.documentElement;
          if (hostContext.theme === "dark" || hostContext.theme === "light") {
            root.setAttribute("data-theme", hostContext.theme);
          }
          var styles = hostContext.styles || {};
          var vars = styles.variables || {};
          for (var name in vars) {
            if (typeof vars[name] === "string" && name.indexOf("--") === 0) {
              root.style.setProperty(name, vars[name]);
            }
          }
          if (styles.css && typeof styles.css.fonts === "string") {
            var sheet =
              document.getElementById("host-fonts") ||
              document.createElement("style");
            sheet.id = "host-fonts";
            sheet.textContent = styles.css.fonts;
            document.head.appendChild(sheet);
          }
        }

        function reportSize() {
          var el = document.getElementById("root");
          if (!el) return;
          notify("ui/notifications/size-changed", {
            width: Math.ceil(el.scrollWidth),
            height: Math.ceil(el.getBoundingClientRect().height),
          });
        }
        var sizeTimer = null;
        function scheduleSizeReport() {
          if (sizeTimer) clearTimeout(sizeTimer);
          sizeTimer = setTimeout(reportSize, 50);
        }
        if (typeof ResizeObserver === "function") {
          new ResizeObserver(scheduleSizeReport).observe(
            document.getElementById("root"),
          );
        }

        request("ui/initialize", {
          protocolVersion: UI_PROTOCOL_VERSION,
          appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] },
          capabilities: {},
          clientInfo: { name: "signaldb-service-map-app", version: "1" },
        })
          .then(function (result) {
            applyHostContext((result && result.hostContext) || {});
            notify("ui/notifications/initialized", {});
            setStatus("Waiting for the service map…");
          })
          .catch(function (err) {
            setStatus(
              "Host did not complete the UI handshake" +
                (err && err.message ? ": " + err.message : ""),
              true,
            );
          });

        /* ============================================================
         * Tool payloads
         * ============================================================ */

        function onToolInput(params) {
          var args = params.arguments || {};
          if (args.service)
            setStatus("Fetching the service map for " + args.service + "…");
          else setStatus("Fetching the service map…");
        }

        function onToolResult(result) {
          var payload = result.structuredContent;
          if (!payload) payload = parseTextContent(result.content);
          if (result.isError) {
            setStatus(
              textOf(result.content) || "The service map lookup failed",
              true,
            );
            return;
          }
          if (!payload || typeof payload !== "object" || !payload.graph) {
            setStatus("No graph payload in the tool result", true);
            return;
          }
          try {
            render(payload);
          } catch (err) {
            setStatus(
              "Could not render this service map: " +
                (err && err.message ? err.message : String(err)),
              true,
            );
          }
          scheduleSizeReport();
        }

        function textOf(content) {
          if (!Array.isArray(content)) return "";
          for (var i = 0; i < content.length; i++) {
            if (content[i] && content[i].type === "text")
              return content[i].text || "";
          }
          return "";
        }
        function parseTextContent(content) {
          var text = textOf(content);
          if (!text) return null;
          try {
            return JSON.parse(text);
          } catch (err) {
            return null;
          }
        }

        function setStatus(message, isError) {
          var root = document.getElementById("root");
          root.innerHTML =
            '<div class="status' +
            (isError ? " error" : "") +
            '">' +
            '<span class="dot"></span><span></span></div>';
          root.querySelector(".status span:last-child").textContent = message;
          scheduleSizeReport();
        }

        /* ============================================================
         * Service map rendering
         *
         * The tool result is `{ graph: { nodes: [...], edges: [...],
         * dropped_nodes }, summary: "..." }` — the same `ServiceGraph` shape
         * the `graph` Query IR envelope returns (see
         * docs/users/querying-ir.md). Rendered as a node table plus an edge
         * table rather than a laid-out diagram: no external layout library
         * is available inside this self-contained document.
         * ============================================================ */

        function esc(value) {
          return String(value).replace(/[&<>"']/g, function (c) {
            return {
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[c];
          });
        }

        function fmtRate(n) {
          return (Number(n) || 0).toFixed(2);
        }
        function fmtPct(n) {
          return ((Number(n) || 0) * 100).toFixed(1) + "%";
        }
        function fmtMs(ns) {
          if (ns === null || ns === undefined) return "—";
          return (Number(ns) / 1e6).toFixed(1) + "ms";
        }

        function nameOf(nodesById, id) {
          var node = nodesById[id];
          return node ? node.name : id;
        }

        function render(payload) {
          var graph = payload.graph || { nodes: [], edges: [] };
          var nodes = graph.nodes || [];
          var edges = graph.edges || [];
          var nodesById = {};
          for (var i = 0; i < nodes.length; i++)
            nodesById[nodes[i].id] = nodes[i];

          var html = "";
          if (payload.summary) {
            html += '<div class="summary">' + esc(payload.summary) + "</div>";
          }
          if (graph.dropped_nodes) {
            html +=
              '<div class="banner">' +
              esc(graph.dropped_nodes) +
              " node(s) dropped by the server-side node cap.</div>";
          }

          if (nodes.length === 0) {
            html +=
              '<div class="banner">No service traffic in this window.</div>';
            document.getElementById("root").innerHTML = html;
            return;
          }

          html +=
            '<table><caption class="lbl">Services and dependencies</caption>' +
            "<thead><tr><th>Node</th><th>Kind</th><th>Req/s</th><th>Error rate</th><th>p95</th></tr></thead><tbody>";
          for (var n = 0; n < nodes.length; n++) {
            var node = nodes[n];
            var cls =
              node.kind === "external" ? "node-external" : "node-service";
            var errCls = node.error_rate > 0 ? " err" : "";
            html +=
              "<tr><td class=" +
              JSON.stringify(cls) +
              ">" +
              esc(node.name) +
              "</td><td>" +
              esc(node.dependency_kind || node.kind) +
              "</td><td>" +
              (node.request_rate === undefined
                ? "—"
                : fmtRate(node.request_rate)) +
              "</td><td class=" +
              JSON.stringify(errCls.trim()) +
              ">" +
              (node.error_rate === undefined ? "—" : fmtPct(node.error_rate)) +
              "</td><td>" +
              fmtMs(node.p95_ns) +
              "</td></tr>";
          }
          html += "</tbody></table>";

          if (edges.length > 0) {
            html +=
              '<table><caption class="lbl">Calls</caption>' +
              "<thead><tr><th>Caller</th><th></th><th>Callee</th><th>Rate</th><th>Errors</th><th>p95</th></tr></thead><tbody>";
            for (var e = 0; e < edges.length; e++) {
              var edge = edges[e];
              var edgeErrCls = edge.error_rate > 0 ? " err" : "";
              html +=
                "<tr><td>" +
                esc(nameOf(nodesById, edge.source)) +
                "</td><td>&rarr;</td><td>" +
                esc(nameOf(nodesById, edge.target)) +
                "</td><td>" +
                fmtRate(edge.rate) +
                "/s</td><td class=" +
                JSON.stringify(edgeErrCls.trim()) +
                ">" +
                fmtPct(edge.error_rate) +
                "</td><td>" +
                fmtMs(edge.p95_ns) +
                "</td></tr>";
            }
            html += "</tbody></table>";
          }

          document.getElementById("root").innerHTML = html;
        }
      })();
    </script>
  </body>
</html>
