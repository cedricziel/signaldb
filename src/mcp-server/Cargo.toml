[package]
name = "mcp-server"
version = "0.2.1"
edition.workspace = true
license.workspace = true

[dependencies]
signaldb-sdk.workspace = true
# Self-monitoring only: span factories, app metrics, HTTP server-span
# middleware, and telemetry init. No catalog, storage, or auth from here.
common.workspace = true
rmcp.workspace = true

tokio.workspace = true
axum.workspace = true

anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
dashmap.workspace = true

[dev-dependencies]
# Only tests construct raw responses; production reaches SignalDB solely
# through signaldb-sdk (client-surface-parity).
reqwest.workspace = true
tower.workspace = true
futures.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk = { workspace = true, features = ["trace", "testing"] }
tracing-opentelemetry.workspace = true
# `client` drives an in-memory MCP session against the server in tests, so the
# MCP Apps surface is asserted over the real protocol rather than in isolation.
rmcp = { workspace = true, features = ["client"] }

