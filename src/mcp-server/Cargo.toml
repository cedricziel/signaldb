[package]
name = "mcp-server"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[features]
jemalloc = ["dep:tikv-jemallocator"]

[dependencies]
signaldb-sdk.workspace = true
tikv-jemallocator = { workspace = true, optional = true }
rmcp.workspace = true

tokio.workspace = true
axum.workspace = true
http = "1"
reqwest.workspace = true

anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
dashmap.workspace = true

[dev-dependencies]
tower.workspace = true
# `client` drives an in-memory MCP session against the server in tests, so the
# MCP Apps surface is asserted over the real protocol rather than in isolation.
rmcp = { workspace = true, features = ["client"] }

[[bin]]
name = "signaldb-mcp"
path = "src/main.rs"
