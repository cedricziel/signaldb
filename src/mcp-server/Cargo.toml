[package]
name = "mcp-server"
version = "0.2.2"
edition.workspace = true
license.workspace = true

[dependencies]
signaldb-sdk.workspace = true
# Self-monitoring only: span factories, app metrics, HTTP server-span
# middleware, and telemetry init. No catalog, storage, or auth from here.
common.workspace = true
rmcp.workspace = true

tokio.workspace = true
axum.workspace = true

anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
dashmap.workspace = true
# `POST /oauth/introspect` (change: mcp-multi-tenant-oauth-grants) is
# deliberately excluded from the generated OpenAPI spec (matching
# `/oauth/token`/`/oauth/register`'s existing precedent), so it is not on
# `signaldb_sdk::Client`; this is the one direct HTTP call this crate makes
# outside the SDK.
reqwest.workspace = true
# `discover_datasets`/`server_info` fan out one request per granted tenant
# for a multi-tenant OAuth credential; `join_all` runs them concurrently.
futures.workspace = true

[dev-dependencies]
tower.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk = { workspace = true, features = ["trace", "testing"] }
tracing-opentelemetry.workspace = true
# `client` drives an in-memory MCP session against the server in tests, so the
# MCP Apps surface is asserted over the real protocol rather than in isolation.
rmcp = { workspace = true, features = ["client"] }

