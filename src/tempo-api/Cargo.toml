[package]
name = "tempo-api"
description = "Grafana Tempo API models"
version = "0.1.3"
edition.workspace = true
# Grafana Tempo is AGPL-3.0, and proto/tempo.proto is a copy of its tempopb
# definitions, from which src/generated/tempopb.rs is built. See openspec D2.
license = "AGPL-3.0"
# Packages and builds standalone since proto generation moved to
# `cargo xtask generate` — the build script that wrote into this directory and
# read a submodule outside the crate root is gone. Still unpublished: that is a
# separate decision, and the manifest has no publication metadata yet.
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
utoipa.workspace = true

prost.workspace = true

tonic.workspace = true
tonic-prost.workspace = true


[features]
default = []
client = []
server = []

