[package]
name = "signaldb-bin"
version = "0.3.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "signaldb"
path = "src/main.rs"

[dependencies]
tracing.workspace = true
tikv-jemallocator = { workspace = true, optional = true }
# Only include the necessary service dependencies
acceptor = { path = "../acceptor" }
common = { path = "../common" }
compactor = { path = "../compactor" }
querier = { path = "../querier" }
router = { path = "../router" }
writer = { path = "../writer" }

# Essential external dependencies
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
tokio.workspace = true
tonic.workspace = true

[dev-dependencies]
cargo-husky.workspace = true

[package.metadata.cargo-machete]
# cargo-husky is used for git hooks configuration
ignored = ["cargo-husky"]

[features]
jemalloc = ["dep:tikv-jemallocator"]
jemalloc-profiling = ["jemalloc", "common/jemalloc-profiling"]
