[package]
name = "signaldb-bin"
version = "0.5.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "signaldb"
path = "src/main.rs"

[dependencies]
tracing.workspace = true
tikv-jemallocator = { workspace = true, optional = true }
# Only include the necessary service dependencies
acceptor = { path = "../acceptor" }
common = { path = "../common" }
compactor = { path = "../compactor" }
mcp-server = { path = "../mcp-server" }
querier = { path = "../querier" }
router = { path = "../router" }
writer = { path = "../writer" }

# Essential external dependencies
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
tokio.workspace = true
tonic.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
cargo-husky.workspace = true
datafusion.workspace = true
tempfile.workspace = true

[package.metadata.cargo-machete]
# cargo-husky is used for git hooks configuration
# workspace-hack is managed by `cargo hakari` (see workspace-hack/README.md)
ignored = ["cargo-husky", "workspace-hack"]

[features]
jemalloc = ["dep:tikv-jemallocator"]
jemalloc-profiling = ["jemalloc", "tikv-jemallocator/profiling", "common/jemalloc-profiling"]
