[package]
name = "signal-producer"
version = "0.2.2"
edition.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true

anyhow.workspace = true
clap.workspace = true
rand.workspace = true
tracing-subscriber.workspace = true

opentelemetry = { workspace = true, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { workspace = true, features = ["trace", "metrics", "logs"] }
opentelemetry-otlp = { workspace = true, features = ["grpc-tonic", "trace", "metrics", "logs"] }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[package.metadata.cargo-machete]
# workspace-hack is managed by `cargo hakari` (see workspace-hack/README.md)
ignored = ["workspace-hack"]

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["trace", "testing"] }
