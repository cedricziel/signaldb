[package]
name = "writer"
version = "0.3.0"
edition.workspace = true
license.workspace = true

[features]
default = []
benchmarks = ["dep:criterion"]

[dependencies]
common.workspace = true

datafusion.workspace = true
arrow-flight.workspace = true
object_store.workspace = true

# Iceberg table format support
iceberg-rust.workspace = true

tokio.workspace = true
futures.workspace = true

anyhow.workspace = true
clap.workspace = true

tracing.workspace = true
opentelemetry.workspace = true

uuid.workspace = true
bytes.workspace = true
tonic.workspace = true
chrono.workspace = true
hex.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# Optional dependencies for benchmarks
criterion = { workspace = true, optional = true }

[[bench]]
name = "iceberg_benchmarks"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "schema_transform_benchmarks"
harness = false
required-features = ["benchmarks"]

[dev-dependencies]
common = { workspace = true, features = ["testing"] }
tokio-stream.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk = { workspace = true, features = ["trace", "testing"] }
opentelemetry-proto.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
tempfile.workspace = true

[package.metadata.cargo-machete]
ignored = ["tokio-stream"]
