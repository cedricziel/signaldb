[package]
name = "querier"
version = "0.2.1"
edition.workspace = true
license.workspace = true

[dependencies]
tikv-jemallocator = { workspace = true, optional = true }
common = { path = "../common" }
logql = { path = "../logql" }
tempo-api = { path = "../tempo-api", features = ["server"] }

async-trait.workspace = true
chrono.workspace = true
regex = "1"
dashmap.workspace = true
hex.workspace = true

anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
log.workspace = true
datafusion.workspace = true
tracing.workspace = true
opentelemetry.workspace = true
tonic.workspace = true
arrow-flight.workspace = true
object_store.workspace = true
futures.workspace = true
bytes.workspace = true
url.workspace = true
serde.workspace = true
serde_json.workspace = true
iceberg-rust.workspace = true
datafusion_iceberg.workspace = true

thiserror.workspace = true
promql-parser.workspace = true

# PromQL support

[dev-dependencies]
common = { path = "../common", features = ["testing"] }
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry_sdk = { workspace = true, features = ["trace", "testing"] }

[[bin]]
name = "signaldb-querier"
path = "src/main.rs"

[features]
jemalloc = ["dep:tikv-jemallocator"]
jemalloc-profiling = ["jemalloc", "common/jemalloc-profiling"]
