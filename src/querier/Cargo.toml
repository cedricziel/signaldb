[package]
name = "querier"
version = "0.4.1"
edition.workspace = true
license.workspace = true

[features]
# Builds the `structural_ancestry` bench under benches/ and the hook it calls.
benchmarks = []

[dependencies]
common = { path = "../common" }
logql.workspace = true
traceql.workspace = true
ql-ir = { path = "../ql-ir" }
tempo-api = { path = "../tempo-api", features = ["server"] }

async-trait.workspace = true
chrono.workspace = true
regex = "1"
dashmap.workspace = true
hex.workspace = true

anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
datafusion.workspace = true
tracing.workspace = true
opentelemetry.workspace = true
tonic.workspace = true
arrow-flight.workspace = true
object_store.workspace = true
futures.workspace = true
bytes.workspace = true
url.workspace = true
serde.workspace = true
serde_json.workspace = true
iceberg-rust.workspace = true
datafusion_iceberg.workspace = true

thiserror.workspace = true
promql-parser.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[package.metadata.cargo-machete]
# workspace-hack is managed by `cargo hakari` (see workspace-hack/README.md)
ignored = ["workspace-hack"]

[dev-dependencies]
common = { path = "../common", features = ["testing"] }
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry_sdk = { workspace = true, features = ["trace", "testing"] }

[[bench]]
name = "structural_ancestry"
harness = false
required-features = ["benchmarks"]

[lints]
workspace = true
