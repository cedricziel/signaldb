name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short # Changed from 1 to short for better performance
  CARGO_INCREMENTAL: 0 # Disable incremental compilation for CI
  CARGO_NET_RETRY: 10

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect whether anything outside the Grafana plugin changed. The plugin
  # is a standalone workspace with its own CI (grafana-plugin-*.yml); the
  # jobs below are skipped for plugin-only changes. A workflow-level
  # paths-ignore must NOT be used for this: the ruleset requires
  # "Check & Lint" and "Test Suite (stable)", and a path-filtered workflow
  # never reports those contexts, deadlocking plugin-only PRs. Skipped
  # jobs, by contrast, satisfy required checks.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for changes outside the Grafana plugin
        id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR checkouts are merge commits; first parent is the base tip.
            base=$(git rev-parse HEAD^1)
          else
            base="${{ github.event.before }}"
            if ! git cat-file -e "$base" 2>/dev/null; then
              # Branch creation or force push: no usable before-SHA.
              echo "core=true" >> "$GITHUB_OUTPUT"
              echo "ui=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          changed=$(git diff --name-only "$base" HEAD)
          # UI and plugin are standalone npm workspaces with their own CI;
          # skip (not path-filter) the Rust jobs for changes contained there.
          core_changed=$(echo "$changed" | grep -vE '^src/grafana-plugin/|^src/ui/|^\.github/workflows/grafana-plugin-' || true)
          ui_changed=$(echo "$changed" | grep -E '^src/ui/|^pnpm-lock\.yaml$|^pnpm-workspace\.yaml$|^\.github/workflows/ci\.yml$' || true)
          if [ -n "$core_changed" ]; then
            echo "core=true" >> "$GITHUB_OUTPUT"
          else
            echo "core=false" >> "$GITHUB_OUTPUT"
            echo "Only Grafana plugin / UI files changed; core CI will be skipped."
          fi
          if [ -n "$ui_changed" ]; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
          fi

  # Explore UI: typecheck, lint, test, build. Skipped (not path-filtered)
  # when no UI files changed so a required "UI" context still reports.
  ui:
    name: UI
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter signaldb-ui typecheck

      - name: Lint
        run: pnpm --filter signaldb-ui lint

      - name: Test
        run: pnpm --filter signaldb-ui test

      - name: Build
        run: pnpm --filter signaldb-ui build

  # Fast preliminary checks - fail fast strategy
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.core == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          cache: false  # Using Swatinem/rust-cache instead

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "check"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler mold clang

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check --workspace --all-targets --all-features

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Parallel test matrix - depends on check passing
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta]

    steps:
      - uses: actions/checkout@v7

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          cache: false  # Using Swatinem/rust-cache instead

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test-${{ matrix.rust }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler mold clang

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup test environment
        run: |
          mkdir -p .data
          # Tests use testcontainers - no need for external database configuration

      - name: Run all tests
        run: |
          export RUSTC_WRAPPER=sccache
          cargo test --profile ci-test --workspace --all-features
        env:
          RUST_LOG: warn # Reduced log level for faster tests
          RUST_BACKTRACE: 1

  # Build jobs - run after check passes (parallel with tests)
  build-binaries:
    name: Build Binaries
    runs-on: ${{ matrix.os }}
    needs: check
    strategy:
      matrix:
        include:
          # Reduced matrix - only build what you actually deploy
          - os: ubuntu-latest
            deployment: monolithic
          - os: ubuntu-latest
            deployment: microservices
          # Only add macOS if you actually need macOS binaries
          - os: macos-latest
            deployment: monolithic

    steps:
      - uses: actions/checkout@v7

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false  # Using Swatinem/rust-cache instead

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "build-${{ matrix.os }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler mold clang

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install protobuf

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Build binaries
        run: |
          export RUSTC_WRAPPER=sccache
          if [ "${{ matrix.deployment }}" = "monolithic" ]; then
            cargo build --release -p signaldb-bin --bin signaldb
          else
            cargo build --release -p acceptor --bin signaldb-acceptor
            cargo build --release -p router --bin signaldb-router
            cargo build --release -p writer --bin signaldb-writer
            cargo build --release -p querier --bin signaldb-querier
          fi

      - name: Test binary execution
        run: |
          if [ "${{ matrix.deployment }}" = "monolithic" ]; then
            ./target/release/signaldb --help
            ./target/release/signaldb --version
          else
            ./target/release/signaldb-acceptor --help
            ./target/release/signaldb-acceptor --version
            ./target/release/signaldb-router --help
            ./target/release/signaldb-router --version
            ./target/release/signaldb-writer --help
            ./target/release/signaldb-writer --version
            ./target/release/signaldb-querier --help
            ./target/release/signaldb-querier --version
          fi

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.deployment }}
          path: target/release/signaldb*
          retention-days: 7

  # Static musl binaries for container images. Built on the host runner
  # where rust-cache + sccache make rebuilds incremental, instead of inside
  # docker where layer caching is all-or-nothing and misses on every
  # Cargo.toml change. The docker jobs below just copy these in.
  build-musl-amd64:
    name: Build musl Binaries (amd64)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-unknown-linux-musl
          cache: false  # Using Swatinem/rust-cache instead

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "musl-amd64"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler musl-tools mold clang

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Build musl binaries
        run: |
          export RUSTC_WRAPPER=sccache
          cargo build --release --target x86_64-unknown-linux-musl \
            --bin signaldb-acceptor \
            --bin signaldb-router \
            --bin signaldb-writer \
            --bin signaldb-querier \
            --bin signaldb-compactor \
            --bin signaldb \
            --bin signaldb-cli

      - name: Stage binaries
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/signaldb \
             target/x86_64-unknown-linux-musl/release/signaldb-acceptor \
             target/x86_64-unknown-linux-musl/release/signaldb-router \
             target/x86_64-unknown-linux-musl/release/signaldb-writer \
             target/x86_64-unknown-linux-musl/release/signaldb-querier \
             target/x86_64-unknown-linux-musl/release/signaldb-compactor \
             target/x86_64-unknown-linux-musl/release/signaldb-cli \
             dist/

      - name: Upload musl binaries
        uses: actions/upload-artifact@v7
        with:
          name: musl-binaries-amd64
          path: dist/
          retention-days: 7

  build-musl-arm64:
    name: Build musl Binaries (arm64)
    runs-on: ubuntu-24.04-arm
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-unknown-linux-musl
          cache: false  # Using Swatinem/rust-cache instead

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "musl-arm64"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler musl-tools mold clang

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Build musl binaries
        run: |
          export RUSTC_WRAPPER=sccache
          cargo build --release --target aarch64-unknown-linux-musl \
            --bin signaldb-acceptor \
            --bin signaldb-router \
            --bin signaldb-writer \
            --bin signaldb-querier \
            --bin signaldb-compactor \
            --bin signaldb \
            --bin signaldb-cli

      - name: Stage binaries
        run: |
          mkdir -p dist
          cp target/aarch64-unknown-linux-musl/release/signaldb \
             target/aarch64-unknown-linux-musl/release/signaldb-acceptor \
             target/aarch64-unknown-linux-musl/release/signaldb-router \
             target/aarch64-unknown-linux-musl/release/signaldb-writer \
             target/aarch64-unknown-linux-musl/release/signaldb-querier \
             target/aarch64-unknown-linux-musl/release/signaldb-compactor \
             target/aarch64-unknown-linux-musl/release/signaldb-cli \
             dist/

      - name: Upload musl binaries
        uses: actions/upload-artifact@v7
        with:
          name: musl-binaries-arm64
          path: dist/
          retention-days: 7

  # Docker image build - copy-only images from prebuilt musl binaries,
  # split by architecture. No layer caching needed: the expensive compile
  # happens in the build-musl-* jobs above.
  # Docker build for amd64 (runs on all events)
  docker-build-amd64:
    name: Build Docker Image (amd64)
    runs-on: ubuntu-latest
    # test gates the image push: a commit with a red test suite must not
    # be published to ghcr, even though the binaries already built
    needs: [build-musl-amd64, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Download musl binaries
        uses: actions/download-artifact@v8
        with:
          name: musl-binaries-amd64
          path: dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch,suffix=-amd64
            type=ref,event=pr,suffix=-amd64

      - name: Build and optionally push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: monolithic
          build-args: |
            BUILDER=prebuilt
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Docker build for arm64 (only on main branch, not PRs)
  docker-build-arm64:
    name: Build Docker Image (arm64)
    runs-on: ubuntu-24.04-arm
    # test gates the image push; see docker-build-amd64
    needs: [build-musl-arm64, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Download musl binaries
        uses: actions/download-artifact@v8
        with:
          name: musl-binaries-arm64
          path: dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch,suffix=-arm64

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: monolithic
          build-args: |
            BUILDER=prebuilt
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Merge architecture-specific images into multi-arch manifest (main only)
  docker-manifest:
    name: Create Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: [docker-build-amd64, docker-build-arm64]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          docker buildx imagetools create -t ghcr.io/${{ github.repository }}:main \
            ghcr.io/${{ github.repository }}:main-amd64 \
            ghcr.io/${{ github.repository }}:main-arm64

  # Lightweight deployment test - only essential combinations
  deployment-test:
    name: Deployment Test
    runs-on: ubuntu-latest
    needs: build-binaries
    strategy:
      matrix:
        deployment: [monolithic, microservices]

    steps:
      - uses: actions/checkout@v7

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: binaries-ubuntu-latest-${{ matrix.deployment }}
          path: target/release/

      - name: Make binaries executable
        run: chmod +x target/release/signaldb*

      - name: Configure environment
        run: |
          # Create writable data directory
          mkdir -p ${{ runner.temp }}/signaldb-data
          chmod 755 ${{ runner.temp }}/signaldb-data

          # Use SQLite for deployment testing (faster and more reliable)
          echo "SIGNALDB_DATABASE_DSN=sqlite://${{ runner.temp }}/signaldb-data/test_deployment.db" >> $GITHUB_ENV
          echo "SIGNALDB_DISCOVERY_DSN=sqlite://${{ runner.temp }}/signaldb-data/test_deployment.db" >> $GITHUB_ENV
          echo "SIGNALDB_STORAGE_DSN=file://${{ runner.temp }}/signaldb-data/storage" >> $GITHUB_ENV

      - name: Test deployment
        run: |
          if [ "${{ matrix.deployment }}" = "monolithic" ]; then
            timeout 5s ./target/release/signaldb || echo "Monolithic test completed"
          else
            timeout 3s ./target/release/signaldb-acceptor &
            timeout 3s ./target/release/signaldb-router &
            timeout 3s ./target/release/signaldb-writer &
            wait
            echo "Microservices test completed"
          fi

  # Security and coverage jobs - run in parallel with tests
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false  # Using Swatinem/rust-cache instead

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "security"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install security tools
        run: |
          export RUSTC_WRAPPER=sccache
          cargo install cargo-audit cargo-deny cargo-machete

      - name: Run security audit
        run: cargo audit

      - name: Run cargo deny
        run: cargo deny check

      - name: Check for unused dependencies
        run: cargo machete --with-metadata

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: check
    # Only run coverage on main branch or when specifically requested
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'coverage')

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: signaldb_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview
          cache: false  # Using Swatinem/rust-cache instead

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "coverage"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler mold clang

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      - name: Setup environment
        run: |
          mkdir -p .data
          echo "DATABASE_URL=postgres://postgres:postgres@localhost:5432/signaldb_test" >> $GITHUB_ENV
          echo "SIGNALDB_DATABASE_DSN=postgres://postgres:postgres@localhost:5432/signaldb_test" >> $GITHUB_ENV
          echo "SIGNALDB_DISCOVERY_DSN=postgres://postgres:postgres@localhost:5432/signaldb_test" >> $GITHUB_ENV

      - name: Generate coverage report
        run: |
          export RUSTC_WRAPPER=sccache
          cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
