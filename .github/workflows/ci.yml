name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short # Changed from 1 to short for better performance
  CARGO_INCREMENTAL: 0 # Disable incremental compilation for CI
  CARGO_NET_RETRY: 10

# Cancel superseded PR runs, but never main runs: only main saves the
# rust-cache entries every PR restores from, and a cancelled main run
# (via cache-on-failure) saves a *partial* target dir under the primary
# key, which rust-cache then never overwrites until Cargo.lock changes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detect whether anything outside the Grafana plugin changed. The plugin
  # is a standalone workspace with its own CI (grafana-plugin-*.yml); the
  # jobs below are skipped for plugin-only changes on non-main targets. A
  # workflow-level paths-ignore must NOT be used for this: the ruleset
  # requires "Check & Lint" and "Test Suite (stable)", and a path-filtered
  # workflow never reports those contexts, deadlocking plugin-only PRs.
  # Skipped jobs, by contrast, satisfy required checks — except when the
  # skip-cause job is itself skipped (matrix jobs skipped via `needs:` don't
  # expand, so their context name never matches what's required); to avoid
  # that failure mode entirely, anything targeting main always runs full CI
  # regardless of what changed. See the "always run full CI on main" branch
  # in the filter step below.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      ui: ${{ steps.filter.outputs.ui }}
      images: ${{ steps.filter.outputs.images }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for changes outside the Grafana plugin
        id: filter
        shell: bash
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          # The path-filter skip below is a cost optimization for PRs stacked
          # on top of each other (e.g. gh-stack layers), where an
          # intermediate layer's diff genuinely is plugin/UI-only. It must
          # NOT apply to anything landing on main: main is the actual merge
          # gate, and skipped jobs whose skip-cause is itself skipped report
          # under a name that never matches the matrix-expanded required-check
          # context (e.g. "Test Suite" instead of "Test Suite (stable)"),
          # deadlocking the PR forever. Always run full CI when the target
          # is main.
          #
          # `images` is independent of that rule: it gates the release-mode
          # musl/glibc builds and the docker image jobs, none of which is a
          # required check and none of which publishes anything on a PR. Those
          # jobs are the most expensive part of the pipeline (thin-LTO over
          # the whole DataFusion graph, once per binary), so on PRs they run
          # only when something that can break them changed — the Dockerfile,
          # the dependency graph, cargo/toolchain config, this workflow — or
          # when the PR carries the `build-images` label (add it, then re-run
          # the workflow). Pushes to main always build and publish.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "core=true" >> "$GITHUB_OUTPUT"
            echo "ui=true" >> "$GITHUB_OUTPUT"
            echo "images=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # PR checkouts are merge commits; first parent is the base tip.
          base=$(git rev-parse HEAD^1)
          changed=$(git diff --name-only "$base" HEAD)

          images_changed=$(echo "$changed" | grep -E '^(Dockerfile|\.dockerignore|Cargo\.lock|Cargo\.toml|\.cargo/|rust-toolchain|\.github/workflows/ci\.yml)' || true)
          if [ -n "$images_changed" ] || echo " $PR_LABELS " | grep -q ' build-images '; then
            echo "images=true" >> "$GITHUB_OUTPUT"
          else
            echo "images=false" >> "$GITHUB_OUTPUT"
            echo "No image-affecting files changed and no build-images label; release/image jobs will be skipped."
          fi

          if [ "${{ github.event.pull_request.base.ref }}" = "main" ]; then
            echo "core=true" >> "$GITHUB_OUTPUT"
            echo "ui=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # UI and plugin are standalone npm workspaces with their own CI;
          # skip (not path-filter) the Rust jobs for changes contained there.
          core_changed=$(echo "$changed" | grep -vE '^src/grafana-plugin/|^src/ui/|^\.github/workflows/grafana-plugin-' || true)
          ui_changed=$(echo "$changed" | grep -E '^src/ui/|^pnpm-lock\.yaml$|^pnpm-workspace\.yaml$|^\.github/workflows/ci\.yml$' || true)
          if [ -n "$core_changed" ]; then
            echo "core=true" >> "$GITHUB_OUTPUT"
          else
            echo "core=false" >> "$GITHUB_OUTPUT"
            echo "Only Grafana plugin / UI files changed; core CI will be skipped."
          fi
          if [ -n "$ui_changed" ]; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
          fi

  # Explore UI: typecheck, lint, test, build. Skipped (not path-filtered)
  # when no UI files changed so a required "UI" context still reports.
  ui:
    name: UI
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter signaldb-ui typecheck

      - name: Lint
        run: pnpm --filter signaldb-ui lint

      - name: "Test (coverage gate: 80%)"
        run: pnpm --filter signaldb-ui test:coverage

      - name: Build
        run: pnpm --filter signaldb-ui build

      - name: Install Playwright browsers
        run: pnpm --filter signaldb-ui exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm --filter signaldb-ui test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: src/ui/playwright-report/
          retention-days: 7

  # Verify the generated clients are in sync with the code-first OpenAPI spec.
  # `cargo xtask check` regenerates the progenitor Rust SDK and the hey-api
  # TypeScript UI client from api/signaldb-api.json and fails on any drift, so
  # it needs both a Rust toolchain (rustfmt) and pnpm (to run openapi-ts). The
  # spec-vs-code gate itself rides the router golden test in the Test Suite job.
  codegen:
    name: Generated code up-to-date
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.ui == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          cache: false # Using Swatinem/rust-cache instead

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "codegen"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated clients match the OpenAPI spec
        run: cargo run -p xtask -- check

  # Fast preliminary checks - fail fast strategy
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.core == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          cache: false  # Using Swatinem/rust-cache instead

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "check"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler mold clang

      - name: Check formatting
        run: cargo fmt --all -- --check

      # clippy drives the same type-check pass as `cargo check`, so a
      # separate check step only repeats ~80s of work on the gating path.
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Span-construction guard (otel-compliant-self-tracing): boundary spans
      # must come from the factories in common::self_monitoring::spans — the
      # single place that knows the semconv names/kinds. Three greppable
      # invariants, precise enough to avoid false positives:
      #  1. no bare #[tracing::instrument] — always skip_all/skip + explicit
      #     bounded fields (auto-recorded args are a cardinality/PII leak)
      #  2. otel.kind never appears outside the factory module — setting a
      #     span kind IS boundary-span construction
      #  3. no log:: macros — first-party code emits tracing:: events directly
      #     (the log facade is not a workspace dependency)
      - name: Span construction guard
        run: |
          set -e
          if grep -rn --include='*.rs' -E '#\[tracing::instrument\]$' src/ tests-integration/; then
            echo "::error::bare #[tracing::instrument] auto-records arguments; use skip_all + explicit fields" >&2
            exit 1
          fi
          if grep -rn --include='*.rs' 'otel\.kind' src/ tests-integration/ | grep -v 'src/common/src/self_monitoring/'; then
            echo "::error::otel.kind outside common::self_monitoring — open boundary spans via the span factories" >&2
            exit 1
          fi
          if grep -rn --include='*.rs' -E '\blog::(trace|debug|info|warn|error|log)!' src/ tests-integration/; then
            echo "::error::log:: macros are forbidden — use the equivalent tracing:: macro (structured fields preferred)" >&2
            exit 1
          fi

      # Validate the SignalDB semantic-convention registry (Weaver pinned —
      # 0.x, breaking minor releases). The factories' literal field names are
      # pinned against this registry by common's registry_pins tests.
      - name: Weaver registry check
        run: |
          docker run --rm -v "$PWD/otel/registry:/registry" \
            otel/weaver:v0.25.1 registry check -r /registry

      # Dependency audits ride along here instead of in their own job: the
      # tools are prebuilt binaries (no `cargo install`, no extra target-dir
      # cache), and none of them needs a compiled workspace.
      - name: Install audit tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny,cargo-machete

      - name: Run security audit
        run: cargo audit

      - name: Run cargo deny
        run: cargo deny check

      - name: Check for unused dependencies
        run: cargo machete --with-metadata

  # macOS is a supported release target (release-please ships darwin
  # binaries), so keep a cheap compile signal on every PR. A full release
  # build here would repeat the same thin-LTO cost as the Linux jobs for no
  # additional coverage; `cargo check` catches the platform-specific breakage
  # (cfg gates, linker-only crates) in a few minutes.
  check-macos:
    name: Check (macOS)
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.core == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false # Using Swatinem/rust-cache instead

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "check-macos"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install system dependencies
        run: brew install protobuf

      - name: Cargo check
        run: cargo check --workspace --all-targets --all-features

  # Test matrix. Runs in parallel with Check & Lint rather than after it:
  # the two share no artifacts, and waiting on lint added ~3 minutes to the
  # merge-gating path for nothing (a compile error fails both fast anyway).
  # The beta toolchain is an early-warning signal, not a merge gate, so it
  # runs only on pushes to main. The matrix must still expand on PRs so the
  # required "Test Suite (stable)" context keeps its name.
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.core == 'true'
    strategy:
      fail-fast: false
      matrix:
        rust: ${{ fromJSON(github.event_name == 'push' && '["stable", "beta"]' || '["stable"]') }}

    steps:
      - uses: actions/checkout@v7

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          cache: false  # Using Swatinem/rust-cache instead

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test-${{ matrix.rust }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler mold clang

      - name: Setup test environment
        run: |
          mkdir -p .data
          # Tests use testcontainers - no need for external database configuration

      - name: Run all tests
        run: |
          cargo test --profile ci-test --workspace --all-features
        env:
          RUST_LOG: warn # Reduced log level for faster tests
          RUST_BACKTRACE: 1

  # Static musl binaries for container images. Built on the host runner
  # where rust-cache keeps the dependency graph warm, instead of inside
  # docker where layer caching is all-or-nothing and misses on every
  # Cargo.toml change. The docker jobs below just copy these in.
  build-musl-amd64:
    name: Build musl Binaries (amd64)
    runs-on: ubuntu-latest
    needs: [changes, check]
    if: needs.changes.outputs.images == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-unknown-linux-musl
          cache: false  # Using Swatinem/rust-cache instead
          # Must stay empty: this action defaults RUSTFLAGS to "-D warnings",
          # and a set RUSTFLAGS replaces (never merges with) the per-target
          # rustflags in .cargo/config.toml. With the default, the mold linker
          # and the +aes/+sse4.2 target features are silently dropped and the
          # published binaries ship ahash's scalar fallback. Warnings are still
          # gated: the Check & Lint job runs clippy with an explicit -D warnings.
          rustflags: ""

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "musl-amd64"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler musl-tools mold clang

      - name: Build musl binaries
        run: |
          cargo build --release --target x86_64-unknown-linux-musl \
            --features signaldb-bin/jemalloc \
            --bin signaldb \
            --bin signaldb-cli

      - name: Stage binaries
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/signaldb \
             target/x86_64-unknown-linux-musl/release/signaldb-cli \
             dist/

      - name: Upload musl binaries
        uses: actions/upload-artifact@v7
        with:
          name: musl-binaries-amd64
          path: dist/
          retention-days: 7

  # Heap-profiling build of the monolithic binary. Separate from the musl
  # jobs because jemalloc's profiler can only walk stacks safely when its
  # unwinder and libc come from one toolchain, which rules musl out for us:
  # our musl cross compiler is a glibc gcc in a spec wrapper, so a profiling
  # musl binary SIGSEGVs on the first profiled allocation. A native glibc
  # toolchain on a plain runner has no such mismatch.
  #
  # amd64 only for now; arm64 is a follow-up if operators need it.
  build-glibc-profiling-amd64:
    name: Build glibc Profiling Binary (amd64)
    runs-on: ubuntu-latest
    needs: [changes, check]
    if: needs.changes.outputs.images == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-unknown-linux-gnu
          cache: false  # Using Swatinem/rust-cache instead

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "glibc-profiling-amd64"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler mold clang

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Build glibc profiling binary
        run: |
          export RUSTC_WRAPPER=sccache
          cargo build --release --target x86_64-unknown-linux-gnu \
            --features signaldb-bin/jemalloc,signaldb-bin/jemalloc-profiling \
            --bin signaldb \
            --bin signaldb-cli

      # Guards the whole point of this job: a binary that crashes under
      # MALLOC_CONF=prof:true is exactly the bug this variant exists to avoid.
      - name: Verify heap profiling does not crash
        run: |
          MALLOC_CONF=prof:true \
            ./target/x86_64-unknown-linux-gnu/release/signaldb --help > /dev/null

      - name: Stage binaries
        run: |
          mkdir -p dist-glibc
          cp target/x86_64-unknown-linux-gnu/release/signaldb dist-glibc/
          cp target/x86_64-unknown-linux-gnu/release/signaldb-cli dist-glibc/

      - name: Upload glibc profiling binary
        uses: actions/upload-artifact@v7
        with:
          name: glibc-profiling-binaries-amd64
          path: dist-glibc/
          retention-days: 7

  build-musl-arm64:
    name: Build musl Binaries (arm64)
    runs-on: ubuntu-24.04-arm
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-unknown-linux-musl
          cache: false  # Using Swatinem/rust-cache instead
          rustflags: "" # see build-musl-amd64

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "musl-arm64"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler musl-tools mold clang

      - name: Build musl binaries
        run: |
          cargo build --release --target aarch64-unknown-linux-musl \
            --features signaldb-bin/jemalloc \
            --bin signaldb \
            --bin signaldb-cli

      - name: Stage binaries
        run: |
          mkdir -p dist
          cp target/aarch64-unknown-linux-musl/release/signaldb \
             target/aarch64-unknown-linux-musl/release/signaldb-cli \
             dist/

      - name: Upload musl binaries
        uses: actions/upload-artifact@v7
        with:
          name: musl-binaries-arm64
          path: dist/
          retention-days: 7

  # Explore UI dist for the container images, built once per run (with
  # pnpm caching) instead of once per image build inside docker, where
  # pnpm has no cache. Gated like the docker jobs that consume it.
  build-ui:
    name: Build UI dist
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.images == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build UI
        run: pnpm --filter signaldb-ui build

      - name: Upload UI dist
        uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: src/ui/dist
          retention-days: 7

  # Docker image build - copy-only images from prebuilt musl binaries,
  # split by architecture. No layer caching needed: the expensive compile
  # happens in the build-musl-* jobs above.
  # Docker build for amd64 (runs on all events)
  docker-build-amd64:
    name: Build Docker Image (${{ matrix.service }}, amd64)
    runs-on: ubuntu-latest
    # test gates the image push: a commit with a red test suite must not
    # be published to ghcr, even though the binaries already built
    needs: [build-musl-amd64, build-ui, test]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [monolithic, acceptor, router, writer, querier, compactor, mcp]
    steps:
      - uses: actions/checkout@v7

      - name: Download musl binaries
        uses: actions/download-artifact@v8
        with:
          name: musl-binaries-amd64
          path: dist/

      - name: Download UI dist
        uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui-dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The monolithic image keeps the bare repository name; per-service
      # images live under ghcr.io/<repo>/<service>. Mirrors the release
      # workflow's naming.
      - name: Compute image name
        id: image
        run: |
          if [ "${{ matrix.service }}" = "monolithic" ]; then
            echo "name=ghcr.io/${{ github.repository }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=ghcr.io/${{ github.repository }}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch,suffix=-amd64
            type=ref,event=pr,suffix=-amd64

      - name: Build and optionally push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.service }}
          build-args: |
            BUILDER=prebuilt
            UI_BUILDER=prebuilt
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Heap-profiling image: the monolithic binary on a Debian runtime, built
  # from the glibc binary above. Single-arch (amd64), so it is tagged
  # directly instead of going through the multi-arch manifest job.
  docker-build-glibc-profiling:
    name: Build Docker Image (monolithic, glibc profiling, amd64)
    runs-on: ubuntu-latest
    # test gates the image push; see docker-build-amd64
    needs: [build-glibc-profiling-amd64, build-ui, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Download glibc profiling binary
        uses: actions/download-artifact@v8
        with:
          name: glibc-profiling-binaries-amd64
          path: dist-glibc/

      - name: Download UI dist
        uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui-dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch,suffix=-glibc-profiling
            type=ref,event=pr,suffix=-glibc-profiling

      - name: Build and optionally push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: monolithic-glibc-profiling
          build-args: |
            UI_BUILDER=prebuilt
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Docker build for arm64 (only on main branch, not PRs)
  docker-build-arm64:
    name: Build Docker Image (${{ matrix.service }}, arm64)
    runs-on: ubuntu-24.04-arm
    # test gates the image push; see docker-build-amd64
    needs: [build-musl-arm64, build-ui, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [monolithic, acceptor, router, writer, querier, compactor, mcp]
    steps:
      - uses: actions/checkout@v7

      - name: Download musl binaries
        uses: actions/download-artifact@v8
        with:
          name: musl-binaries-arm64
          path: dist/

      - name: Download UI dist
        uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui-dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # See the amd64 job for the image naming scheme.
      - name: Compute image name
        id: image
        run: |
          if [ "${{ matrix.service }}" = "monolithic" ]; then
            echo "name=ghcr.io/${{ github.repository }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=ghcr.io/${{ github.repository }}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch,suffix=-arm64

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.service }}
          build-args: |
            BUILDER=prebuilt
            UI_BUILDER=prebuilt
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Merge architecture-specific images into multi-arch manifest (main only)
  docker-manifest:
    name: Create Multi-Arch Manifest (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [docker-build-amd64, docker-build-arm64]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [monolithic, acceptor, router, writer, querier, compactor, mcp]
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # See the docker-build-amd64 job for the image naming scheme.
      - name: Compute image name
        id: image
        run: |
          if [ "${{ matrix.service }}" = "monolithic" ]; then
            echo "name=ghcr.io/${{ github.repository }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=ghcr.io/${{ github.repository }}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push manifest
        run: |
          docker buildx imagetools create -t ${{ steps.image.outputs.name }}:main \
            ${{ steps.image.outputs.name }}:main-amd64 \
            ${{ steps.image.outputs.name }}:main-arm64

  # Lightweight deployment test - only essential combinations. Runs the
  # static musl binaries the images ship, so it exercises the real
  # artifacts and needs no separate glibc release build.
  deployment-test:
    name: Deployment Test
    runs-on: ubuntu-latest
    needs: build-musl-amd64
    strategy:
      matrix:
        deployment: [monolithic, microservices]

    steps:
      - uses: actions/checkout@v7

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: musl-binaries-amd64
          path: target/release/

      - name: Make binaries executable
        run: chmod +x target/release/signaldb*

      - name: Configure environment
        run: |
          # Create writable data directory
          mkdir -p ${{ runner.temp }}/signaldb-data
          chmod 755 ${{ runner.temp }}/signaldb-data

          # Use SQLite for deployment testing (faster and more reliable)
          echo "SIGNALDB_DATABASE_DSN=sqlite://${{ runner.temp }}/signaldb-data/test_deployment.db" >> $GITHUB_ENV
          echo "SIGNALDB_DISCOVERY_DSN=sqlite://${{ runner.temp }}/signaldb-data/test_deployment.db" >> $GITHUB_ENV
          echo "SIGNALDB_STORAGE_DSN=file://${{ runner.temp }}/signaldb-data/storage" >> $GITHUB_ENV

      - name: Test deployment
        run: |
          if [ "${{ matrix.deployment }}" = "monolithic" ]; then
            timeout 5s ./target/release/signaldb || echo "Monolithic test completed"
          else
            # One binary, one service per subcommand (openspec: multi-call-binary)
            timeout 3s ./target/release/signaldb acceptor &
            timeout 3s ./target/release/signaldb router &
            timeout 3s ./target/release/signaldb writer &
            wait
            echo "Microservices test completed"
          fi
          # Every service must answer --version and --help from the one binary
          for svc in acceptor router writer querier compactor mcp; do
            ./target/release/signaldb "$svc" --version
            ./target/release/signaldb "$svc" --help > /dev/null
          done

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: check
    # Only run coverage on main branch or when specifically requested
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'coverage')

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: signaldb_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview
          cache: false  # Using Swatinem/rust-cache instead

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "coverage"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler mold clang

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      - name: Setup environment
        run: |
          mkdir -p .data
          echo "DATABASE_URL=postgres://postgres:postgres@localhost:5432/signaldb_test" >> $GITHUB_ENV
          echo "SIGNALDB_DATABASE_DSN=postgres://postgres:postgres@localhost:5432/signaldb_test" >> $GITHUB_ENV
          echo "SIGNALDB_DISCOVERY_DSN=postgres://postgres:postgres@localhost:5432/signaldb_test" >> $GITHUB_ENV

      - name: Generate coverage report
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
