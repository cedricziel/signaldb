name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "scripts/render-bench-summary.py"
      - "scripts/render-schema-files.py"
      - "otel/registry/manifest.yaml"
      - "src/common/CHANGELOG.md"
      - ".github/workflows/docs.yml"
  # Re-publish after each nightly benchmark run so the "latest results"
  # table and the trend charts under /benchmarks/ stay current.
  workflow_run:
    workflows: [Benchmarks]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    # A failed benchmark run has nothing new to publish.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install "mkdocs-material==9.*"

      # Nightly Criterion results live on the machine-written benchmark-data
      # branch (see benchmarks.yml). Pull them in so the benchmarking page
      # shows the latest table and the trend charts ship with the site. Both
      # steps are no-ops until the first nightly run has pushed data.
      - name: Fetch benchmark trend data
        run: |
          if git fetch --depth=1 origin benchmark-data 2>/dev/null; then
            mkdir -p bench-data
            git archive FETCH_HEAD dev/bench | tar -x -C bench-data
            echo "fetched $(ls bench-data/dev/bench | wc -l) file(s) of trend data"
          else
            echo "no benchmark-data branch yet; publishing without results"
          fi

      - name: Render latest benchmark results into the docs
        run: |
          if [ -f bench-data/dev/bench/data.js ]; then
            python3 scripts/render-bench-summary.py \
              bench-data/dev/bench/data.js docs/contributing/benchmarking.md
          fi

      - name: Build
        run: mkdocs build --site-dir _site

      # SignalDB's telemetry carries schema_url: <site>/schemas/<version> on
      # every instrumentation scope; publish one OTel telemetry-schema file
      # per released version at exactly that path (see
      # docs/users/schema-registry.md).
      - name: Publish telemetry schema files
        run: |
          python3 scripts/render-schema-files.py \
            otel/registry/manifest.yaml src/common/CHANGELOG.md _site

      - name: Add benchmark trend charts to the site
        run: |
          if [ -d bench-data/dev/bench ]; then
            mkdir -p _site/benchmarks
            cp -R bench-data/dev/bench/. _site/benchmarks/
          fi

      - uses: actions/upload-pages-artifact@v5

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
