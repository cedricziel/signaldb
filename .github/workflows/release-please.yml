name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['src/signaldb-bin--release_created'] }}
      tag_name: ${{ steps.release.outputs['src/signaldb-bin--tag_name'] }}
      grafana-plugin--release_created: ${{ steps.release.outputs['src/grafana-plugin--release_created'] }}
      grafana-plugin--tag_name: ${{ steps.release.outputs['src/grafana-plugin--tag_name'] }}
      grafana-plugin--version: ${{ steps.release.outputs['src/grafana-plugin--version'] }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.MY_RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-release:
    name: Build Release Binaries
    runs-on: ${{ matrix.os }}
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      # One target's failure must not cancel the other release archives.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_suffix: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_suffix: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_suffix: ".exe"

    steps:
      - uses: actions/checkout@v7

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        # mold + clang: .cargo/config.toml links x86_64-unknown-linux-gnu
        # with clang and -fuse-ld=mold
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler mold clang

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install protobuf

      - name: Install system dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install protoc

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Build release binaries
        # The release-${target} rust-cache is only refreshed on release
        # runs, so it lags main by a whole release cycle; sccache backfills
        # the compiler-level cache across that gap.
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Package CLI
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release

          mkdir -p signaldb-cli-${{ matrix.target }}
          cp signaldb-cli${{ matrix.binary_suffix }} signaldb-cli-${{ matrix.target }}/
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a signaldb-cli-${{ matrix.target }}.zip signaldb-cli-${{ matrix.target }}/
          else
            tar czf signaldb-cli-${{ matrix.target }}.tar.gz signaldb-cli-${{ matrix.target }}/
          fi

      - name: Package binaries
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release

          # Create directories for different deployment models
          mkdir -p signaldb-monolithic-${{ matrix.target }}
          mkdir -p signaldb-microservices-${{ matrix.target }}

          # Package monolithic deployment
          cp signaldb${{ matrix.binary_suffix }} signaldb-monolithic-${{ matrix.target }}/
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a signaldb-monolithic-${{ matrix.target }}.zip signaldb-monolithic-${{ matrix.target }}/
          else
            tar czf signaldb-monolithic-${{ matrix.target }}.tar.gz signaldb-monolithic-${{ matrix.target }}/
          fi

          # Package microservices deployment
          cp signaldb-acceptor${{ matrix.binary_suffix }} signaldb-microservices-${{ matrix.target }}/
          cp signaldb-router${{ matrix.binary_suffix }} signaldb-microservices-${{ matrix.target }}/
          cp signaldb-writer${{ matrix.binary_suffix }} signaldb-microservices-${{ matrix.target }}/
          cp signaldb-querier${{ matrix.binary_suffix }} signaldb-microservices-${{ matrix.target }}/
          cp signaldb-compactor${{ matrix.binary_suffix }} signaldb-microservices-${{ matrix.target }}/
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a signaldb-microservices-${{ matrix.target }}.zip signaldb-microservices-${{ matrix.target }}/
          else
            tar czf signaldb-microservices-${{ matrix.target }}.tar.gz signaldb-microservices-${{ matrix.target }}/
          fi

          # Package the standalone MCP sidecar
          mkdir -p signaldb-mcp-${{ matrix.target }}
          cp signaldb-mcp${{ matrix.binary_suffix }} signaldb-mcp-${{ matrix.target }}/
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a signaldb-mcp-${{ matrix.target }}.zip signaldb-mcp-${{ matrix.target }}/
          else
            tar czf signaldb-mcp-${{ matrix.target }}.tar.gz signaldb-mcp-${{ matrix.target }}/
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/signaldb-monolithic-${{ matrix.target }}.*
            target/${{ matrix.target }}/release/signaldb-microservices-${{ matrix.target }}.*
            target/${{ matrix.target }}/release/signaldb-cli-${{ matrix.target }}.*
            target/${{ matrix.target }}/release/signaldb-mcp-${{ matrix.target }}.*

  # Static musl binaries for the release images, built natively per arch
  # (the previous single docker-build job compiled arm64 under QEMU).
  # Shared rust-cache keys with the CI musl jobs make this incremental.
  build-musl-amd64:
    name: Build musl Binaries (amd64)
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-unknown-linux-musl
          cache: false  # Using Swatinem/rust-cache instead

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "musl-amd64"
          save-if: false  # CI populates this cache on main
          cache-on-failure: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler musl-tools mold clang

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Build musl binaries
        run: |
          export RUSTC_WRAPPER=sccache
          cargo build --release --target x86_64-unknown-linux-musl \
            --bin signaldb-acceptor \
            --bin signaldb-router \
            --bin signaldb-writer \
            --bin signaldb-querier \
            --bin signaldb-compactor \
            --bin signaldb \
            --bin signaldb-cli \
            --bin signaldb-mcp

      - name: Stage binaries
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/signaldb \
             target/x86_64-unknown-linux-musl/release/signaldb-acceptor \
             target/x86_64-unknown-linux-musl/release/signaldb-router \
             target/x86_64-unknown-linux-musl/release/signaldb-writer \
             target/x86_64-unknown-linux-musl/release/signaldb-querier \
             target/x86_64-unknown-linux-musl/release/signaldb-compactor \
             target/x86_64-unknown-linux-musl/release/signaldb-cli \
             target/x86_64-unknown-linux-musl/release/signaldb-mcp \
             dist/

      - name: Upload musl binaries
        uses: actions/upload-artifact@v7
        with:
          name: release-musl-binaries-amd64
          path: dist/
          retention-days: 7

      # The same static binaries double as Linux release archives; kept out
      # of dist/ so the docker jobs' COPY doesn't pick up the tarballs.
      - name: Package release archives
        run: |
          target=x86_64-unknown-linux-musl
          mkdir -p archives/signaldb-monolithic-${target} \
                   archives/signaldb-microservices-${target} \
                   archives/signaldb-cli-${target} \
                   archives/signaldb-mcp-${target}
          cp dist/signaldb archives/signaldb-monolithic-${target}/
          cp dist/signaldb-acceptor dist/signaldb-router dist/signaldb-writer \
             dist/signaldb-querier dist/signaldb-compactor \
             archives/signaldb-microservices-${target}/
          cp dist/signaldb-cli archives/signaldb-cli-${target}/
          cp dist/signaldb-mcp archives/signaldb-mcp-${target}/
          cd archives
          tar czf signaldb-monolithic-${target}.tar.gz signaldb-monolithic-${target}
          tar czf signaldb-microservices-${target}.tar.gz signaldb-microservices-${target}
          tar czf signaldb-cli-${target}.tar.gz signaldb-cli-${target}
          tar czf signaldb-mcp-${target}.tar.gz signaldb-mcp-${target}

      - name: Upload release archives
        uses: actions/upload-artifact@v7
        with:
          name: release-archives-musl-amd64
          path: archives/*.tar.gz
          retention-days: 7

  build-musl-arm64:
    name: Build musl Binaries (arm64)
    runs-on: ubuntu-24.04-arm
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-unknown-linux-musl
          cache: false  # Using Swatinem/rust-cache instead

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "musl-arm64"
          save-if: false  # CI populates this cache on main
          cache-on-failure: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler musl-tools mold clang

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Build musl binaries
        run: |
          export RUSTC_WRAPPER=sccache
          cargo build --release --target aarch64-unknown-linux-musl \
            --bin signaldb-acceptor \
            --bin signaldb-router \
            --bin signaldb-writer \
            --bin signaldb-querier \
            --bin signaldb-compactor \
            --bin signaldb \
            --bin signaldb-cli \
            --bin signaldb-mcp

      - name: Stage binaries
        run: |
          mkdir -p dist
          cp target/aarch64-unknown-linux-musl/release/signaldb \
             target/aarch64-unknown-linux-musl/release/signaldb-acceptor \
             target/aarch64-unknown-linux-musl/release/signaldb-router \
             target/aarch64-unknown-linux-musl/release/signaldb-writer \
             target/aarch64-unknown-linux-musl/release/signaldb-querier \
             target/aarch64-unknown-linux-musl/release/signaldb-compactor \
             target/aarch64-unknown-linux-musl/release/signaldb-cli \
             target/aarch64-unknown-linux-musl/release/signaldb-mcp \
             dist/

      - name: Upload musl binaries
        uses: actions/upload-artifact@v7
        with:
          name: release-musl-binaries-arm64
          path: dist/
          retention-days: 7

      # See the amd64 job; these provide the only Linux arm64 archives.
      - name: Package release archives
        run: |
          target=aarch64-unknown-linux-musl
          mkdir -p archives/signaldb-monolithic-${target} \
                   archives/signaldb-microservices-${target} \
                   archives/signaldb-cli-${target} \
                   archives/signaldb-mcp-${target}
          cp dist/signaldb archives/signaldb-monolithic-${target}/
          cp dist/signaldb-acceptor dist/signaldb-router dist/signaldb-writer \
             dist/signaldb-querier dist/signaldb-compactor \
             archives/signaldb-microservices-${target}/
          cp dist/signaldb-cli archives/signaldb-cli-${target}/
          cp dist/signaldb-mcp archives/signaldb-mcp-${target}/
          cd archives
          tar czf signaldb-monolithic-${target}.tar.gz signaldb-monolithic-${target}
          tar czf signaldb-microservices-${target}.tar.gz signaldb-microservices-${target}
          tar czf signaldb-cli-${target}.tar.gz signaldb-cli-${target}
          tar czf signaldb-mcp-${target}.tar.gz signaldb-mcp-${target}

      - name: Upload release archives
        uses: actions/upload-artifact@v7
        with:
          name: release-archives-musl-arm64
          path: archives/*.tar.gz
          retention-days: 7

  # Explore UI dist, built once per release: the router and monolithic
  # images copy it in (UI_BUILDER=prebuilt) instead of each compiling it
  # inside docker, and it ships as a release asset for archive users, who
  # point SIGNALDB_UI_DIR at the unpacked directory.
  build-ui:
    name: Build Explore UI
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build UI
        run: pnpm --filter signaldb-ui build

      - name: Upload UI dist
        uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: src/ui/dist
          retention-days: 7

      - name: Package UI archive
        run: |
          mkdir -p archives/signaldb-ui
          cp -R src/ui/dist/. archives/signaldb-ui/
          tar czf archives/signaldb-ui.tar.gz -C archives signaldb-ui

      - name: Upload UI archive
        uses: actions/upload-artifact@v7
        with:
          name: release-archive-ui
          path: archives/*.tar.gz
          retention-days: 7

  docker-build-amd64:
    name: Build Docker Image (${{ matrix.service }}, amd64)
    runs-on: ubuntu-latest
    needs: [release-please, build-musl-amd64, build-ui]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        service: [monolithic, acceptor, router, writer, querier, compactor, mcp]
    steps:
      - uses: actions/checkout@v7

      - name: Download musl binaries
        uses: actions/download-artifact@v8
        with:
          name: release-musl-binaries-amd64
          path: dist/

      - name: Download UI dist
        uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui-dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The monolithic image keeps the bare repository name; per-service
      # images live under ghcr.io/<repo>/<service>.
      - name: Compute image name
        id: image
        run: |
          if [ "${{ matrix.service }}" = "monolithic" ]; then
            echo "name=ghcr.io/${{ github.repository }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=ghcr.io/${{ github.repository }}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          # latest=false: metadata-action's latest=auto default would add a
          # plain (unsuffixed) latest tag here, letting a single-arch image
          # overwrite it; the manifest job owns the multi-arch latest tag.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }},suffix=-amd64

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.service }}
          build-args: |
            BUILDER=prebuilt
            UI_BUILDER=prebuilt
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  docker-build-arm64:
    name: Build Docker Image (${{ matrix.service }}, arm64)
    runs-on: ubuntu-24.04-arm
    needs: [release-please, build-musl-arm64, build-ui]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        service: [monolithic, acceptor, router, writer, querier, compactor, mcp]
    steps:
      - uses: actions/checkout@v7

      - name: Download musl binaries
        uses: actions/download-artifact@v8
        with:
          name: release-musl-binaries-arm64
          path: dist/

      - name: Download UI dist
        uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui-dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # See the amd64 job for the image naming scheme.
      - name: Compute image name
        id: image
        run: |
          if [ "${{ matrix.service }}" = "monolithic" ]; then
            echo "name=ghcr.io/${{ github.repository }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=ghcr.io/${{ github.repository }}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          # latest=false: see the amd64 job; the manifest job owns latest.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }},suffix=-arm64

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.service }}
          build-args: |
            BUILDER=prebuilt
            UI_BUILDER=prebuilt
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  docker-manifest:
    name: Create Multi-Arch Release Manifest (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [release-please, docker-build-amd64, docker-build-arm64]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        service: [monolithic, acceptor, router, writer, querier, compactor, mcp]
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # See the docker-build-amd64 job for the image naming scheme.
      - name: Compute image name
        id: image
        run: |
          if [ "${{ matrix.service }}" = "monolithic" ]; then
            echo "name=ghcr.io/${{ github.repository }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=ghcr.io/${{ github.repository }}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}

      - name: Create and push manifests
        run: |
          version="${{ steps.meta.outputs.version }}"
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create -t "$tag" \
              "${{ steps.image.outputs.name }}:${version}-amd64" \
              "${{ steps.image.outputs.name }}:${version}-arm64"
          done <<< "${{ steps.meta.outputs.tags }}"

  upload-assets:
    name: Upload Release Assets
    runs-on: ubuntu-latest
    # Deliberately not gated on the docker jobs: binary assets and image
    # publishing are independent, and a transient registry failure must
    # not block the tarballs from reaching the release.
    needs: [release-please, build-release, build-musl-amd64, build-musl-arm64, build-ui]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}

    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          draft: false
          prerelease: ${{ contains(needs.release-please.outputs.tag_name, 'alpha') || contains(needs.release-please.outputs.tag_name, 'beta') || contains(needs.release-please.outputs.tag_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Grafana Plugin Release Jobs
  grafana-plugin-frontend:
    name: Build Grafana Plugin Frontend
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs['grafana-plugin--release_created'] == 'true' }}
    outputs:
      plugin-id: ${{ steps.metadata.outputs.plugin-id }}
    defaults:
      run:
        working-directory: src/grafana-plugin
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build frontend
        run: pnpm build:frontend

      - name: Get plugin metadata
        id: metadata
        run: |
          PLUGIN_ID=$(cat dist/plugin.json | jq -r .id)
          echo "plugin-id=${PLUGIN_ID}" >> $GITHUB_OUTPUT

      - name: Upload frontend build
        uses: actions/upload-artifact@v7
        with:
          name: grafana-plugin-frontend
          path: src/grafana-plugin/dist
          retention-days: 1

  grafana-plugin-backend:
    name: Build Grafana Plugin Backend (${{ matrix.target.os }}-${{ matrix.target.arch }})
    runs-on: ${{ matrix.target.runner }}
    needs: release-please
    if: ${{ needs.release-please.outputs['grafana-plugin--release_created'] == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: linux
            arch: amd64
            rust-target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            rust-target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
          - os: darwin
            arch: amd64
            rust-target: x86_64-apple-darwin
            runner: macos-latest
          - os: darwin
            arch: arm64
            rust-target: aarch64-apple-darwin
            runner: macos-latest
          - os: windows
            arch: amd64
            rust-target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.rust-target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target.os == 'linux' && matrix.target.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install mold linker (Linux AMD64)
        # The repo-level .cargo/config.toml links x86_64-unknown-linux-gnu
        # with clang and -fuse-ld=mold, and it applies to the backend
        # workspace too; the plugin's own CI installs mold the same way.
        if: matrix.target.os == 'linux' && matrix.target.arch == 'amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y mold clang

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: grafana-plugin-${{ matrix.target.rust-target }}
          workspaces: src/grafana-plugin/backend

      - name: Build backend
        # Run from inside the backend workspace — the repo-level
        # .cargo/config.toml sets a relative target-dir, so cargo's output
        # lands under $CWD/target.
        working-directory: src/grafana-plugin/backend
        run: cargo build --release --target ${{ matrix.target.rust-target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Prepare artifact (Unix)
        if: matrix.target.os != 'windows'
        run: |
          mkdir -p artifact
          cp src/grafana-plugin/backend/target/${{ matrix.target.rust-target }}/release/gpx_signaldb_datasource artifact/gpx_signaldb_datasource_${{ matrix.target.os }}_${{ matrix.target.arch }}

      - name: Prepare artifact (Windows)
        if: matrix.target.os == 'windows'
        shell: bash
        run: |
          mkdir -p artifact
          cp src/grafana-plugin/backend/target/${{ matrix.target.rust-target }}/release/gpx_signaldb_datasource.exe artifact/gpx_signaldb_datasource_${{ matrix.target.os }}_${{ matrix.target.arch }}.exe

      - name: Upload backend binary
        uses: actions/upload-artifact@v7
        with:
          name: grafana-plugin-backend-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: artifact/
          retention-days: 1

  grafana-plugin-package:
    name: Package and Release Grafana Plugin
    runs-on: ubuntu-latest
    needs: [release-please, grafana-plugin-frontend, grafana-plugin-backend]
    if: ${{ needs.release-please.outputs['grafana-plugin--release_created'] == 'true' }}
    env:
      GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
    defaults:
      run:
        working-directory: src/grafana-plugin
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Download frontend build
        uses: actions/download-artifact@v8
        with:
          name: grafana-plugin-frontend
          path: src/grafana-plugin/dist

      - name: Download all backend binaries
        uses: actions/download-artifact@v8
        with:
          pattern: grafana-plugin-backend-*
          path: src/grafana-plugin/dist
          merge-multiple: true

      - name: Set executable permissions
        run: chmod +x dist/gpx_signaldb_datasource_* || true

      - name: Sign plugin
        run: pnpm sign
        if: ${{ env.GRAFANA_ACCESS_POLICY_TOKEN != '' }}

      - name: Package plugin
        id: package
        run: |
          PLUGIN_ID=$(cat dist/plugin.json | jq -r .id)
          VERSION="${{ needs.release-please.outputs['grafana-plugin--version'] }}"
          ARCHIVE="${PLUGIN_ID}-${VERSION}.zip"
          mv dist ${PLUGIN_ID}
          zip ${ARCHIVE} ${PLUGIN_ID} -r
          echo "archive=${ARCHIVE}" >> $GITHUB_OUTPUT
          echo "plugin-id=${PLUGIN_ID}" >> $GITHUB_OUTPUT

      - name: Validate plugin
        run: |
          docker run --pull=always \
            -v $PWD/${{ steps.package.outputs.archive }}:/archive.zip \
            grafana/plugin-validator-cli /archive.zip

      - name: Generate checksums
        run: sha256sum ${{ steps.package.outputs.archive }} > ${{ steps.package.outputs.archive }}.sha256

      - name: Upload plugin to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            src/grafana-plugin/${{ steps.package.outputs.archive }}
            src/grafana-plugin/${{ steps.package.outputs.archive }}.sha256
          tag_name: ${{ needs.release-please.outputs['grafana-plugin--tag_name'] }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
