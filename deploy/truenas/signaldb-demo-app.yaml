# SignalDB demo instance as a TrueNAS SCALE custom app (Docker Compose).
#
# A self-contained SignalDB monolith fed by a trimmed-down OpenTelemetry
# Demo (https://github.com/open-telemetry/opentelemetry-demo): the shop
# frontend and the services it calls on a normal page load and checkout,
# driven by the Locust load generator. Kafka, the accounting/fraud
# consumers, Envoy, the image provider and the observability
# backends of the upstream demo are left out.
#
# Everything the demo emits lands in tenant `demo`, dataset `otel-demo`.
# Only the SignalDB UI/query API is published on the host (30210); put a
# reverse proxy (e.g. a Pangolin resource) in front of it for public access.
# Search for REPLACE and example.com before installing.

networks:
  default:
    enable_ipv6: false

configs:
  signaldb_toml:
    content: |
      [database]
      dsn = "sqlite:///data/signaldb.db"

      [storage]
      dsn = "file:///data/storage"

      [schema]
      catalog_type = "sql"
      catalog_uri = "sqlite:///data/catalog.db"

      [discovery]
      dsn = "sqlite:///data/discovery.db"

      [wal]
      wal_dir = "/data/wal"

      [querier]
      memory_limit_mb = 1024

      [auth]
      admin_api_key = "sk-admin-REPLACE"

      [[auth.tenants]]
      id = "demo"
      slug = "demo"
      name = "OpenTelemetry Demo"
      default_dataset = "otel-demo"

      [[auth.tenants.api_keys]]
      key = "sk-demo-REPLACE"
      name = "Demo key"

      [[auth.tenants.datasets]]
      id = "otel-demo"
      slug = "otel-demo"
      is_default = true

      [demo]
      enabled = true
      tenant_id = "demo"
      dataset_id = "otel-demo"
      username = "demo@example.com"
      password = "demo"

  # Upstream mounts these from its source tree; the images don't ship them.
  flagd_json:
    content: |
      {
        "$schema": "https://flagd.dev/schema/v0/flags.json",
        "flags": {
          "productCatalogFailure": {
            "description": "Fail product catalog service on a specific product",
            "state": "ENABLED",
            "variants": {
              "on": true,
              "off": false
            },
            "defaultVariant": "off"
          },
          "recommendationCacheFailure": {
            "description": "Fail recommendation service cache",
            "state": "ENABLED",
            "variants": {
              "on": true,
              "off": false
            },
            "defaultVariant": "off"
          },
          "adManualGc": {
            "description": "Triggers full manual garbage collections in the ad service",
            "state": "ENABLED",
            "variants": {
              "on": true,
              "off": false
            },
            "defaultVariant": "off"
          },
          "adHighCpu": {
            "description": "Triggers high cpu load in the ad service",
            "state": "ENABLED",
            "variants": {
              "on": true,
              "off": false
            },
            "defaultVariant": "off"
          },
          "adFailure": {
            "description": "Fail ad service",
            "state": "ENABLED",
            "variants": {
              "on": true,
              "off": false
            },
            "defaultVariant": "off"
          },
          "kafkaQueueProblems": {
            "description": "Overloads Kafka queue while simultaneously introducing a consumer side delay leading to a lag spike",
            "state": "ENABLED",
            "variants": {
              "on": 100,
              "off": 0
            },
            "defaultVariant": "off"
          },
          "cartFailure": {
            "description": "Fail cart service",
            "state": "ENABLED",
            "variants": {
              "on": true,
              "off": false
            },
            "defaultVariant": "off"
          },
          "paymentFailure": {
            "description": "Fail payment service charge requests n%",
            "state": "ENABLED",
            "variants": {
              "100%": 1,
              "90%": 0.95,
              "75%": 0.75,
              "50%": 0.5,
              "25%": 0.25,
              "10%": 0.1,
              "off": 0
            },
            "defaultVariant": "off"
          },
          "paymentUnreachable": {
            "description": "Payment service is unavailable",
            "state": "ENABLED",
            "variants": {
              "on": true,
              "off": false
            },
            "defaultVariant": "off"
          },
          "loadGeneratorFloodHomepage": {
            "description": "Flood the frontend with a large amount of requests.",
            "state": "ENABLED",
            "variants": {
              "on": 100,
              "off": 0
            },
            "defaultVariant": "off"
          },
          "imageSlowLoad": {
            "description": "slow loading images in the frontend",
            "state": "ENABLED",
            "variants": {
              "10sec": 10000,
              "5sec": 5000,
              "off": 0
            },
            "defaultVariant": "off"
          },
          "emailMemoryLeak": {
            "description": "Memory leak in the email service.",
            "state": "ENABLED",
            "variants": {
              "off": 0,
              "1x": 1,
              "10x": 10,
              "100x": 100,
              "1000x": 1000,
              "10000x": 10000
            },
            "defaultVariant": "off"
          }
        }
      }
